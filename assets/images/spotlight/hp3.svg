    <circle cx="50" cy="42" r="4.4"/><circle cx="30" cy="60" r="4.4"/><circle cx="52" cy="70" r="4.4"/>
    <circle cx="20" cy="86" r="4"/><circle cx="52" cy="86" r="4"/><circle cx="76" cy="86" r="4"/>
  </g>
</svg>
