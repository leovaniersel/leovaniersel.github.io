<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="48" fill="#eef3f8"/>

  <!-- tail -->
  <path d="M 58 79 C 71 83, 79 77, 80 68" stroke="#b98d5c" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- body, upright sentry pose: a meerkat on lookout, scanning -->
  <path d="M 50 36 C 40 36, 36 50, 36 64 C 36 76, 41 83, 50 83 C 59 83, 64 76, 64 64 C 64 50, 60 36, 50 36 Z" fill="#c9a06a"/>
  <path d="M 50 48 C 44.5 48, 42.5 58, 42.5 66 C 42.5 75, 45.5 79.5, 50 79.5 C 54.5 79.5, 57.5 75, 57.5 66 C 57.5 58, 55.5 48, 50 48 Z" fill="#e0c396"/>

  <!-- forepaws held at the chest -->
  <ellipse cx="45.5" cy="52" rx="3.4" ry="4.2" fill="#b98d5c"/>
  <ellipse cx="54.5" cy="52" rx="3.4" ry="4.2" fill="#b98d5c"/>

  <!-- hind feet -->
  <ellipse cx="42" cy="83" rx="5" ry="3" fill="#b98d5c"/>
  <ellipse cx="58" cy="83" rx="5" ry="3" fill="#b98d5c"/>

  <!-- ears -->
  <circle cx="38.5" cy="24" r="4" fill="#6b5240"/>
  <circle cx="61.5" cy="24" r="4" fill="#6b5240"/>

  <!-- head -->
  <ellipse cx="50" cy="27" rx="12.5" ry="11.5" fill="#c9a06a"/>
  <ellipse cx="50" cy="33" rx="6.2" ry="4.8" fill="#e0c396"/>
  <ellipse cx="50" cy="31" rx="2.3" ry="1.7" fill="#3f3128"/>

  <!-- eye patches: the meerkat's signature -->
  <ellipse cx="43.5" cy="25" rx="5" ry="3.6" fill="#3f3128" transform="rotate(-18 43.5 25)"/>
  <ellipse cx="56.5" cy="25" rx="5" ry="3.6" fill="#3f3128" transform="rotate(18 56.5 25)"/>
  <circle cx="44.6" cy="24.2" r="1.1" fill="#ffffff"/>
  <circle cx="57.6" cy="24.2" r="1.1" fill="#ffffff"/>

  <!-- ground: kept clear of the badge edge -->
  <path d="M 24 86 L 76 86" stroke="#c9b79c" stroke-width="3" stroke-linecap="round"/>
</svg>
