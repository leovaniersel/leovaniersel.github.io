<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="48" fill="#eef3f8"/>

  <!-- top slice of bread: flat base, arched shoulders -->
  <path d="M 17 42 L 17 33 C 17 25, 26 23, 35 23 L 65 23 C 74 23, 83 25, 83 33 L 83 42 Z" fill="#e3b06f"/>

  <!-- lettuce -->
  <path d="M 13 42 Q 20 37, 27 42 Q 34 37, 41 42 Q 48 37, 55 42 Q 62 37, 69 42 Q 76 37, 87 42 L 87 50 L 13 50 Z" fill="#6a8f4a"/>

  <!-- tomato -->
  <rect x="15" y="49" width="70" height="9" rx="3.5" fill="#c1273d"/>

  <!-- cheese -->
  <rect x="13" y="57" width="74" height="7" rx="2" fill="#f0b93c"/>

  <!-- bottom slice of bread -->
  <path d="M 17 63 L 83 63 L 83 70 C 83 76, 74 78, 65 78 L 35 78 C 26 78, 17 76, 17 70 Z" fill="#d9a05c"/>

  <!-- the cut: how many layers it crosses is what scanwidth measures -->
  <line x1="52" y1="14" x2="52" y2="86" stroke="#2f6f9f" stroke-width="3" stroke-dasharray="6 4.5" stroke-linecap="round"/>
</svg>
