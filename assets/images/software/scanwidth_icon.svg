<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="48" fill="#eef3f8"/>

  <!-- network arcs: a small rooted network with one reticulation -->
  <g stroke="#5b8bb0" stroke-width="3.6" stroke-linecap="round" fill="none">
    <path d="M 50 16 L 26 38"/>
    <path d="M 50 16 L 74 38"/>
    <path d="M 26 38 L 50 62"/>
    <path d="M 74 38 L 50 62"/>
    <path d="M 26 38 L 21 82"/>
    <path d="M 74 38 L 79 82"/>
    <path d="M 50 62 L 50 82"/>
  </g>

  <!-- scan line: the sweep whose widest cut defines the scanwidth -->
  <line x1="9" y1="50" x2="91" y2="50"
        stroke="#edc07a" stroke-width="2.4" stroke-linecap="round"/>

  <!-- the arcs the scan line cuts -->
  <g fill="#e08a2e" stroke="#eef3f8" stroke-width="1.8">
    <circle cx="24.6" cy="50" r="5.2"/>
    <circle cx="38" cy="50" r="5.2"/>
    <circle cx="62" cy="50" r="5.2"/>
    <circle cx="75.4" cy="50" r="5.2"/>
  </g>

  <!-- vertices -->
  <g fill="#2f6f9f">
    <circle cx="50" cy="16" r="5.5"/>
    <circle cx="26" cy="38" r="5.5"/>
    <circle cx="74" cy="38" r="5.5"/>
    <circle cx="50" cy="62" r="5.5"/>
    <circle cx="21" cy="82" r="5.5"/>
    <circle cx="50" cy="82" r="5.5"/>
    <circle cx="79" cy="82" r="5.5"/>
  </g>
</svg>
