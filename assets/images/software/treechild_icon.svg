<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="48" fill="#eef3f8"/>

  <!-- tree edges: every internal vertex keeps a child that is not a reticulation -->
  <g stroke="#5b8bb0" stroke-width="3.6" stroke-linecap="round" fill="none">
    <path d="M 50 15 L 26 40"/>
    <path d="M 50 15 L 74 40"/>
    <path d="M 26 40 L 22 82"/>
    <path d="M 74 40 L 78 82"/>
    <path d="M 50 62 L 50 82"/>
  </g>

  <!-- the reticulation: the cost this software minimises -->
  <g stroke="#c1273d" stroke-width="3.6" stroke-linecap="round" fill="none">
    <path d="M 26 40 L 50 62"/>
    <path d="M 74 40 L 50 62"/>
  </g>

  <!-- tree vertices -->
  <g fill="#2f6f9f">
    <circle cx="50" cy="15" r="5.5"/>
    <circle cx="26" cy="40" r="5.5"/>
    <circle cx="74" cy="40" r="5.5"/>
    <circle cx="22" cy="82" r="5.5"/>
    <circle cx="50" cy="82" r="5.5"/>
    <circle cx="78" cy="82" r="5.5"/>
  </g>

  <!-- reticulation vertex -->
  <circle cx="50" cy="62" r="6" fill="#c1273d" stroke="#eef3f8" stroke-width="1.6"/>
</svg>
