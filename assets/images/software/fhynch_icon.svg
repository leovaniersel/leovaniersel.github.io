<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="48" fill="#eef3f8"/>

  <!-- tail (forked feathers) -->
  <path d="M 20 52 L 4 47 L 14 58 Z" fill="#7a5a42"/>
  <path d="M 20 59 L 7 65 L 16 56 Z" fill="#6b5040"/>

  <!-- body -->
  <ellipse cx="38" cy="57" rx="24" ry="18" fill="#a97c50"/>

  <!-- wing -->
  <ellipse cx="29" cy="53" rx="13" ry="9" fill="#8a6d5c" transform="rotate(-18 29 53)"/>

  <!-- breast -->
  <ellipse cx="47" cy="65" rx="11" ry="9" fill="#d1495b"/>

  <!-- head -->
  <circle cx="62" cy="40" r="14" fill="#c94f5c"/>

  <!-- beak -->
  <path d="M 75 38 L 88 42 L 75 46 Z" fill="#e0a83e"/>

  <!-- eye -->
  <circle cx="67" cy="36" r="2.6" fill="#2b2b2b"/>
  <circle cx="68" cy="35" r="0.9" fill="#ffffff"/>

  <!-- legs -->
  <line x1="35" y1="74" x2="33" y2="88" stroke="#c98a4b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="45" y1="75" x2="48" y2="89" stroke="#c98a4b" stroke-width="2.5" stroke-linecap="round"/>
</svg>
