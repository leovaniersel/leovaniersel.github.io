  <!-- segment grooves -->
  <g stroke="#8a6242" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 28 44 L 72 44"/>
    <path d="M 29 52 L 71 52"/>
    <path d="M 31 60 L 69 60"/>
    <path d="M 34 68 L 66 68"/>
  </g>

  <!-- cephalon rim and eyes -->
  <path d="M 30 38 C 34 30, 41 26, 50 26 C 59 26, 66 30, 70 38" stroke="#8a6242" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="41" cy="33" r="2.8" fill="#3f3128"/>
  <circle cx="59" cy="33" r="2.8" fill="#3f3128"/>
</svg>
