  thesis: A Polynomial Time Test for when Optimal Traffic Flow is Achievable with
    Semi-Selfish Planners in Parallel Edge Networks
  thesis-url: https://resolver.tudelft.nl/uuid:800f3adb-523f-464c-80c2-e81d3aad753e
  summary: Studies a traffic-routing game in which semi-selfish planners (such as
    autonomous-vehicle coordinators) can suggest routes to their vehicles while still
    acting in their own interest. Characterizes exactly when this setting admits equilibria
    that achieve optimal overall traffic flow, and gives a polynomial-time algorithm
    to decide this for parallel-edge networks with convex cost functions.
  website:
  scholar:
  abstract: 'Selfish routing in traffic networks often leads to inefficient outcomes
    in terms of the aggregate congestion of the networks. With the introduction of
    autonomous vehicles there is an opportunity to reduce this inefficiency, as car
    manufacturers can coordinate their share of traffic to achieve more optimal outcomes.
    To model this, we use a form of repeated weighted atomic splittable routing games
    (RWASRG) where the players are mediators; they can only suggest routes to their
    assigned flow. A further constraint we pose is that the planners are semi-selfish:
    they cannot play strategies where both their own and the aggregate cost are dominated
    by another strategy. In this model the central question is: given a game instance,
    are there rational strategies for the planners which converge to the optimal traffic
    flow such that no possible deviation is profitable for the deviants? So far, existence
    results only show that both YES-instances and NO-instances exist. No general algorithms
    exist to tell if a given instance is a YES-instance or a NO-instance. Only in
    Pigou''s network was an explicit algorithm given to calculate the answer. We give
    three results: necessary and sufficient conditions for a game instance to be a
    YES-instance, an instance showing that the generalized algorithm does not work
    on general networks, and a proof that the generalized algorithm works on parallel
    networks with convex cost functions in polynomial time.'
- name:
    first: Ida
    last: Pelupessy
