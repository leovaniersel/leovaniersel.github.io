  thesis: Phylogenetic Networks with Gene Flow
  thesis-url: https://resolver.tudelft.nl/uuid:4c3f8142-e05d-4d9d-bee6-9cf1783d4403
  summary: Introduces and studies gene-flow networks, an extension of phylogenetic
    networks that can represent bidirectional gene exchange between contemporary lineages
    alongside the unidirectional reticulate events (such as hybridization) captured
    by standard hybrid networks. Investigates which mathematical tools developed for
    hybrid networks carry over to this richer model.
  website:
  scholar:
  abstract: 'Phylogenetic networks generalise phylogenetic trees by allowing reticulate
    evolutionary events such as hybridisation and horizontal gene transfer. Gene flow
    is an additional type of reticulate event that allows genetic material to be exchanged
    bidirectionally between contemporaneous lineages, rather than a unidirectional
    merging of lineages. This thesis introduces gene-flow networks: a generalisation
    of phylogenetic networks (hybrid networks) that represents such bidirectional
    gene flow explicitly, alongside hybrid events, and explores to what extent existing
    theory for hybrid networks carries over to this broader class.'
