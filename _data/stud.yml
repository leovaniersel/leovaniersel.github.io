  thesis: 'Optimization in the Photolithography Bay: Scheduling and the Traveling
    Salesman Problem'
  thesis-url: https://doi.org/10.4233/uuid:12961f87-eeff-41b5-8688-df28e0ad9860
  website: https://www.tudelft.nl/ewi/over-de-faculteit/afdelingen/applied-mathematics/people/drir-tml-teun-janssen
  scholar:
  summary: Addresses scheduling in semiconductor photolithography, where the order
    in which circuit patterns are exposed onto wafers determines total blade travel.
    Formulates the ordering problem as equivalent to the a priori travelling salesman
    problem, and uses integer linear programming to achieve roughly a 20% reduction
    in blade movement.
  abstract: In a semiconductor factory, integrated circuits (or chips) are constructed
    on top of slabs of silicon, called wafers. The construction of these wafers is
    complicated and many different processing steps are needed to gradually build
    the chip layer by layer. Of these steps, photolithography uses the most expensive
    equipment. Therefore, the photolithography equipment is often the bottleneck of
    the factory. Photolithography is used to transfer the geometric pattern of a chip
    on a wafer. First a light-sensitive photoresist is put on the wafer. Then UV light
    is sent through a photomask on the photoresist. The exposed parts of the photoresist
    will chemically react, creating the pattern. After the exposure, chemical reactions
    and metal depositions make a layer of circuits on the wafer. In this thesis, we
    try to increase the production of the semiconductor factory by reducing the time
    needed for the photolithography. The time to process a wafer on a lithography
    stepper machine is determined by different elements of the process. It turns out
    that the blade movement required in the exposure step has a significant impact
    on total time required to process a wafer. The blade movement in turn depends
    on the order in which the different images are processed. Hence we want to find
    an ordering of the images, such that the blade movement is minimized. This problem
    turns out to be equivalent to the a priori traveling salesman problem in the scenario
    model. The practical problem instances found are solved using an integer linear
    programming solver and the average blade movement is reduced by approximately
    20%, which reduces the average exposure time by 1.6%.
- name:
    first: Natalia
    last: Vázquez Purriños
  role: msc
  year: 2026
  thesis: Phylogenetic Network Inference via Reinforcement Learning and Cherry Picking
  thesis-url: https://resolver.tudelft.nl/uuid:ed80a898-2d5b-45fa-b86b-51a86f9ef9c2
  summary: Explores reinforcement learning for phylogenetic network reconstruction
    under the maximum parsimony criterion, reformulating the hybridization problem
    as a Markov Decision Process based on cherry-picking sequences. Combines Monte
    Carlo Tree Search with a deep learning Value Network in an AlphaZero-style framework,
    achieving high success rates within practical computational budgets.
  abstract: Understanding evolutionary history is a cornerstone of biological research,
    yet complex phenomena like hybridization and horizontal gene transfer require
    structures more versatile than simple trees, known as phylogenetic networks. Reconstructing
    these networks under the maximum parsimony principle leads to the Hybridization
    Problem, a combinatorial optimization task that is NP-hard and poses significant
    scalability challenges for existing exact and heuristic methods. This thesis investigates
    whether learning-guided search can provide a scalable approximation framework
    for the Hybridization Problem in temporal phylogenetic networks. The problem is
    reformulated as a Markov Decision Process (MDP) based on the theory of cherry-picking
    sequences (CPS), which establishes a fundamental equivalence between sequence
    weight and the network's reticulation number. Inspired by the AlphaZero paradigm,
    the proposed framework integrates Monte Carlo Tree Search (MCTS) with deep learning,
    employing a modular architecture featuring a Value Network designed to provide
    direct state evaluations in place of computationally expensive heuristic rollouts.
    To handle the graph-theoretical nature of the problem, a hierarchical feature
    engineering pipeline was developed to summarize local leaf-level and global structural
    properties into a compact representation for neural guidance. The framework was
    evaluated through a large-scale benchmark of 460 independent simulations, comparing
    the novel Value-Guided MCTS (V-MCTS) against standard MCTS, randomized heuristics,
    and exact solvers. The results demonstrate that the Standard MCTS achieved the
    highest success rate at 91.74%, while the V-MCTS identified the optimum in 79.35%
    of cases.
- name:
    first: Noud
    last: Riemens
  role: msc
  year: 2025
  company: ORTEC Finance
  thesis: Exploiting Asset Similarities in Sample Efficient Portfolio Optimization
  thesis-url: https://resolver.tudelft.nl/uuid:5c182d18-25f6-4548-98c8-84285753d500
  summary: Addresses sample-efficient multi-objective portfolio optimization using
    Bayesian optimization, introducing a Mahalanobis kernel that learns and exploits
    structural similarities between financial assets. Shows improved surrogate model
    performance and better uncertainty quantification compared to standard ARD Gaussian
    processes, with model averaging over multiple similarity structures giving the
    best results.
  abstract: Multi-objective portfolio optimization problems with complex objectives
    and expensive function evaluations can be solved through the sample efficient
    solution method of Bayesian optimization. In realistic settings, inclusion of
    many assets coupled with a limited evaluation budget negatively impacts the standard
    ARD Gaussian process surrogate model, as in high-dimensional environments this
    kernel no longer permits meaningful inference without a vast number of observations.
    The ARD kernel overestimates problem complexity, as financial assets display significant
    structure or dependence, for instance by belonging to the same asset class. This
    work presents a methodology to learn and exploit these asset similarities through
    a Mahalanobis kernel. Within this kernel, we treat the partitioning structure
    as a latent variable, and learn this structure through a coordinate-wise greedy
    optimization approach based on k-fold cross-validation using previously observed
    data points. We examine our proposed methodology based on ability to retrieve
    synthetic similarities, surrogate predictive and uncertainty quantification performance,
    along with attained hypervolume during Bayesian optimization. Our results show
    we successfully find similarities both in the synthetic and authentic settings,
    leading to improved predictive performance of Gaussian processes equipped with
    the learned Mahalanobis kernel. Furthermore, we showcase the importance of correct
    uncertainty quantification for Bayesian optimization, and achieve improved results
    for models averaged over multiple structures compared to the use of a single locally
    optimal partitioning.
- name:
    first: Floor
    last: Laseur
  role: msc
  year: 2025
  company: Energy Pool
  thesis: Initialization Strategies for Energy Management System Optimization
  thesis-url: https://resolver.tudelft.nl/uuid:7b71d703-3f98-4c8d-abdf-08f3203ec6ab
  summary: Investigates warm-start initialization strategies that reuse previously
    computed solutions to reduce solve time in rolling-horizon Mixed Integer Linear
    Programming for energy management systems. Evaluates variable selection, problem
    reformulation, and Benders decomposition across a range of modeling horizons,
    price profiles, and market strategies.
  abstract: The increasing integration of Renewable Energy Sources (RES), rising global
    electricity demand, and ongoing developments in power market structures collectively
    increase the complexity of Energy Management Systems (EMS). The tight scheduling
    of interdependent decisions in a Rolling Horizon (RH) Mixed Integer Linear Programming
    (MILP) environment requires efficient formulations to remain scalable and flexible
    to future innovations. This thesis investigates initialization strategies (warm
    starts) that leverage previous optimal system configurations to reduce computational
    complexity and solution time. Iterative cycles of variable selection, warm start
    execution, and problem reformulation are evaluated across multiple scenarios.
    These scenarios vary in modeling horizon, day-ahead price profiles, market engagement
    strategies, and environmental and system conditions. Problem reformulations include
    adjustments in the treatment of violation decision variables, linear reformulations,
    and the use of Benders decomposition. The results demonstrate that successful
    warm start implementations can substantially reduce solution times and provide
    valuable insights for further tightening problem formulations.
- name:
    first: Sebastiaan
    tussenvoegsel: van
    last: Krieken
  role: msc
  company: CWI
  year: 2025
  thesis: 'Dense Reachable Subgraphs: Hardness, Algorithms and Experiments'
  thesis-url: https://resolver.tudelft.nl/uuid:bb772d2a-f919-498d-98ad-6fc41456ef4d
  summary: 'Introduces two optimization problems on vertex-weighted multilayer graphs
    motivated by money laundering detection: finding dense reachable subgraphs that
    maximize the ratio of total vertex weight to neighborhood size. Proves NP-hardness
    via reduction from Vertex Cover, provides MILP exact formulations, and develops
    greedy heuristics.'
  abstract: 'We introduce two novel optimization problems on vertex-weighted multilayer
    graphs: the Predecessor Dense Reachable Subgraph (PDRS) problem and the Neighborhood
    Dense Reachable Subgraph (NDRS) problem. In PDRS, the aim is to find a subset
    of vertices that maximizes the ratio of the total vertex weight to the size of
    its predecessor neighborhood, under reachability constraints. A subset is considered
    reachable when it is a union of paths from the first layer to the last. The NDRS
    variant is equivalent to the PDRS problem, but the size of the entire neighborhood
    is used for the denominator of the objective function. The motivation for these
    problems comes from money laundering detection. We prove NP-hardness by reduction
    from the Vertex Cover problem and formulate MILPs that give exact solutions to
    the problems. Additionally, we show that the single path variant, where the solution
    space is restricted to single paths from the first layer to the last, can be solved
    in polynomial time using dynamic programming. We introduce a heuristic algorithm
    called Greedy Single Paths, which starts with the empty graph and uses an exact
    algorithm for the single path variant to iteratively grow the solution. We also
    introduce a heuristic algorithm called Greedy Peeling, which starts with the whole
    graph and iteratively peels vertices from the allowed neighbor set.'
- name:
    first: Tim
    last: Levert
  role: msc
  year: 2025
  thesis: Triplet Encoding of Stemmata
  thesis-url: https://resolver.tudelft.nl/uuid:a590255b-06dd-4f56-a905-c2f41705f525
  summary: Extends triplet-based encoding and reconstruction from phylogenetics to
    internally labelled trees and networks, motivated by stemmatology (the study of
    manuscript genealogy). Proves that complete sets of rooted triplets uniquely determine
    multifurcating trees, general rooted trees, and level-1 networks with internal
    labels, and provides polynomial-time reconstruction algorithms for each class.
  abstract: 'Stemmatology is the study and reconstruction of textual genealogy and
    has several similarities to phylogenetics, the study of evolutionary histories
    of species. Current methods in computational stemmatology often borrow tools from
    phylogenetics, yet classical phylogenetic models are not well suited to the structural
    and labelling requirements of manuscript traditions. In particular, phylogenetics
    typically assumes leaf-labelled trees or networks and lacks the means to accommodate
    internal labels — a feature which is crucial in stemmatology. This thesis addresses
    that gap by studying the encoding and reconstruction of internally labelled trees
    and networks from rooted triplets. Specifically, we consider three classes of
    graphs: multifurcating rooted trees, general rooted trees (allowing nodes with
    out-degree one), and level-1 networks, each with labels on a subset of vertices
    including all leaves and some internal nodes. We prove that, under limited assumptions,
    a complete set of rooted triplets uniquely determines the structure and labelling
    of each of these graph classes up to isomorphism. Building on these encoding theorems,
    we develop polynomial-time algorithms to reconstruct each graph class from its
    full triplet set. All reconstruction algorithms are proven correct and theoretically
    efficient under the given assumptions. We also introduce an extension of the classical
    triplet distance as a metric for comparing internally labelled graphs.'
- name:
    first: Timo
    tussenvoegsel: den
    last: Dulk
  role: msc
  year: 2024
  company: NS
  thesis: Heuristics for strategic passenger-oriented train timetabling
  thesis-url: https://resolver.tudelft.nl/uuid:260d0726-28eb-4506-b2db-dabf2b31b7e7
  summary: Studies Strategic Passenger-Oriented Timetabling (SPOT), which assigns
    departure and arrival times to train services to minimize total perceived passenger
    travel time rather than maximize infrastructure feasibility. Develops local search
    and simulated annealing heuristics as fast alternatives to MILP, and derives lower
    bounds to evaluate solution quality.
  abstract: This thesis addresses a timetabling problem known as Strategic Passenger-Oriented
    Timetabling (SPOT). SPOT is a timetabling problem that involves assigning departure
    and arrival times to train services. Unlike classical timetabling, which typically
    emphasizes infrastructural feasibility, SPOT shifts the focus toward enhancing
    the passenger experience without infrastructural constraints. SPOT evaluates a
    timetable based on the perceived travel time consisting of drive, dwell and transfer
    times, along with additional penalties for inconveniences by transfers and initial
    waiting times of passengers. This thesis explores a heuristic approach to solving
    SPOT using Local Search and Simulated Annealing. Both operate by exploring a neighborhood
    of possible timetables around a current timetable to identify better alternatives.
    The absence of infrastructural constraints in SPOT simplifies the creation of
    these neighborhoods, as different train services do not influence each other.
    Additionally, multiple lower bounds are calculated for the perceived travel time,
    providing benchmarks to evaluate the quality of the solutions. Overall, these
    heuristics are effective in finding good timetables within a short period, with
    the lower bounds being reasonably close to the perceived travel time of the generated
    timetables.
- name:
    first: Theo
    last: Broeders
  role: msc
  year: 2024
  thesis: A Graph-Neural-Network Approach for Reconstructing Temporal Networks
  thesis-url: https://resolver.tudelft.nl/uuid:35a897a9-b80a-471e-aaf5-5f9294212955
  summary: Develops exact and heuristic algorithms for reconstructing minimum-reticulation
    temporal phylogenetic networks from sets of trees, including an exponential-time
    exact algorithm and a cherry-growing technique for feasibility testing. Applies
    Graph Neural Networks to guide cherry-picking heuristics, achieving high accuracy
    even on instances larger than the training data.
  abstract: Reconstructing a minimum reticulation network from phylogenetic trees
    is used in evolutionary studies. In this thesis, we focus on finding temporal
    networks using cherry-picking sequences for binary trees with all taxa. Finding
    such a minimum reticulation temporal network is NP-hard. We introduce an algorithm
    to find a minimum reticulation network with a running time of O(2^n poly(n,t)).
    In addition, this study explores potential enhancements to the algorithm through
    branch and bound. We also introduce an algorithm to determine the existence of
    a temporal phylogenetic network, improved upon by integrating a new concept called
    cherry growing, leading to a notable speed-up in performance. Furthermore, we
    examine the application of Graph Neural Networks (GNN) in heuristics to find a
    cherry-picking sequence which can be used to construct a network. This is done
    by classifying leaves into good and bad leaves. The best-performing GNN model
    has a 97.4% accuracy for evolution-based data and a 79.1% accuracy for random-based
    data. The GNN models are implemented as predictors in two classes of heuristics.
    The tree-search-based heuristic outperforms the cherry-picking-based heuristic,
    and the GNN heuristics outperform their random variant, even for problems substantially
    larger than the GNN was trained on.
- name:
    first: Christopher
    last: Reichling
  role: msc
  year: 2023
  thesis: Classes of Semi-binary Phylogenetic Networks encoded by μ-representations
  thesis-url: https://resolver.tudelft.nl/uuid:3fca1fca-b7d6-4abc-ad2f-960395ce451d
  summary: Studies which classes of semi-binary phylogenetic networks are uniquely
    determined by their μ-representations, enabling polynomial-time network comparison
    and metric computation. Shows that the results do not extend to all network types,
    and demonstrates that μ-representations can identify structural properties such
    as bridges and node in-degrees.
  abstract: This thesis is on the subject of phylogenetic networks. These are schematic
    visualisations used mainly to investigate the evolutionary history of species,
    but which can be used for any set of distinguishable elements which have diverged
    from a common ancestor through some evolutionary process. The research specifically
    focuses on a way to encode these phylogenetic networks, called μ-representation,
    which enables researchers to efficiently compare networks in polynomial time.
    The main contribution of this thesis lies in demonstrating that there are certain
    classes of phylogenetic networks for which the μ-representation or a modified
    version thereof serves as a unique encoding and can therefore be used to generate
    a metric for comparison. Additionally, it is shown that these results do not extend
    to some other classes of networks. Furthermore, this research shows that certain
    other information can be gained from analysing the μ-representation of a network,
    such as which nodes are adjacent to so-called bridges or cut-edges, and what the
    in-degrees of the nodes in the network are.
- name:
    first: Niels
    last: Holtgrefe
  role: msc
  year: 2023
  thesis: Computing the Scanwidth of Directed Acyclic Graphs
  thesis-url: https://resolver.tudelft.nl/uuid:9c82fd2a-5841-4aac-8e40-d4d22542cdf5
  summary: Studies scanwidth — a tree-likeness parameter for directed acyclic graphs
    that generalizes treewidth to directed structures — developing an exact dynamic
    programming algorithm that is XP in scanwidth and FPT for level-l phylogenetic
    networks. Proposes a simulated-annealing heuristic and shows experimentally that
    scanwidth and treewidth are close in practice, motivating scanwidth as a parameter
    in phylogenetic algorithms.
  abstract: 'Phylogenetic networks are a specific type of directed acyclic graph (DAG),
    used to depict evolutionary relationships among, for example, species or other
    groups of organisms. To solve computationally hard problems, treewidth has been
    used to parametrize algorithms in phylogenetics. In the hope of simplifying the
    algorithmic design process, Berry, Scornavacca and Weller recently proposed a
    new measure of tree-likeness that takes into account the directions of the arcs:
    scanwidth. They showed that the corresponding decision problem of this parameter
    is NP-complete. This thesis aims to widen the structural knowledge of scanwidth
    and to find efficient ways of computing it on general DAGs, both by exact and
    heuristic algorithms. With the help of reduction rules, we construct an explicit
    dynamic programming algorithm that computes scanwidth exactly in O(k * n^k * m)
    time for rooted DAGs of scanwidth k. This slicewise polynomial algorithm proves
    that computing the scanwidth is in the complexity class XP, and also functions
    as an FPT algorithm for networks of level-l, with complexity bounded by O(2^(4l-1)
    * l * n + n^2). On the heuristic side, an algorithm enhanced with simulated annealing
    shows promising results, obtaining an average approximation ratio of 1.5 for large
    synthetic networks. Although we prove that scanwidth is always at least as large
    as treewidth, experiments show that they are close to each other in practice,
    motivating scanwidth as a parameter in algorithms.'
- name:
    first: Hans
    last: Keur
  role: msc
  year: 2023
  thesis: Creating phylogenetic networks from clusters
  thesis-url: https://resolver.tudelft.nl/uuid:4dd0bbf1-a734-4e72-af8f-de3c3651c760
  summary: Addresses the construction of phylogenetic networks from tree clusters
    while minimizing the number of reticulations per biconnected component. Presents
    the STCass algorithm (extending the existing Cass algorithm) and an improved variant
    MSTCass, proving optimality and establishing lower and upper bounds on reticulation
    numbers to improve efficiency.
  abstract: In biology, phylogenetics is the study of the evolutionary history of
    and relations between species. Such data are often represented in trees. Remarkably,
    trees lack the representation of reticulation events, such as hybridization. One
    option is to construct a network from trees by creating a network which represents
    all clusters from the trees. We are interested in finding a network having the
    lowest level possible, i.e. the lowest number of reticulations per biconnected
    component. The Cass algorithm is one of the best algorithms in this respect. However,
    it does not always give optimal results. In this thesis, an optimal algorithm
    is presented called STCass, inspired by Cass. We lay theoretical foundations on
    how to build an optimal network. Furthermore, greedy steps are proposed which
    seem to work very well in practice. Based on several optimizations, an improved
    algorithm called MSTCass is presented, which runs faster than STCass in general.
    In order to speed up any Cass-based algorithm or derivatives, several lower bounds
    are presented on the reticulation number per biconnected component of an optimal
    network, along with a new upper bound that can be evaluated in seconds.
- name:
    first: Robbert
    last: Huijsman
  role: msc
  year: 2023
  thesis: Treewidth based algorithms for Tree Containment in phylogenetics
  thesis-url: https://resolver.tudelft.nl/uuid:3906ebda-d667-4d3e-8bee-3f1f4df78387
  summary: Develops explicit dynamic programming algorithms (TWITCH and PITCH) for
    the Tree Containment problem parameterized by treewidth, making two crucial implicit
    steps in an earlier theoretical algorithm computationally practical. Also introduces
    BOTCH, a branching cherry-picking algorithm with FPT runtime, which proves fastest
    in practice.
  abstract: TreeContainment is a well-known problem within phylogenetics, which asks
    whether a binary phylogenetic tree is embedded in a binary phylogenetic network.
    For this problem, Jones, Weller and van Iersel (2022) created an algorithm that
    uses dynamic programming on tree-decompositions to achieve a running time that
    is exponential in the treewidth parameter instead of in the number of reticulations.
    However, due to the implicit formulations of two crucial steps in this algorithm,
    this running time cannot be achieved in practice. This thesis provides two new
    sub-algorithms that generate the required structures explicitly. Additionally,
    criteria and methods that reduce the number of structures generated are introduced.
    These sub-algorithms and improvements are used by two new algorithms TWITCH and
    PITCH, compared to a brute force algorithm and a new branching cherry-picking
    algorithm named BOTCH. The latter has an FPT running time that is exponential
    in the number of vertices that have only reticulations as children. The comparisons
    show that BOTCH has the best test results and is shown to be fast in practice.
- name:
    first: Susan
    last: Veldkamp
  role: msc
  company: NS
  year: 2022
  thesis: A MaxSAT Approach to Solving Frequency Conflicts within Cyclic Train Timetables
  thesis-url: https://resolver.tudelft.nl/uuid:0ca4b6d3-2194-41d1-8a9a-64dd4be9a87a
  summary: Applies MaxSAT solving to overconstrained cyclic train timetabling problems,
    distinguishing hard and soft frequency constraints with weights so that a best-possible
    timetable is always returned even when no fully feasible solution exists. Consistently
    matches or improves on prior ILP-based models while allowing flexible weighting
    of soft constraints.
  abstract: ILP-based solvers that intake a line planning, an infrastructure and a
    set of constraints and then output a cyclic train timetable have been researched
    extensively in the world of trains. However, these types of solvers are not able
    to automatically output a timetable when the problem gets overconstrained and
    no feasible solution exists. This thesis focuses on overcoming the problem of
    overconstraining due to frequency constraints and on consistently producing a
    timetable by using a MaxSAT solver that can distinguish hard and soft constraints
    and assign them weights accordingly. Its aim is to minimize the total weight of
    violated soft constraints while maintaining all hard constraints. The resulting
    model does not always reach a better objective value after an hour of optimizing
    than the model it tries to improve. Nevertheless it is able to handle a set of
    conflicting constraints and always delivers a timetable that is at least as good
    as the one produced by the previous model. Additionally, it is capable of taking
    into account user preference for specific constraints through the weights.
- name:
    first: Frank
    tussenvoegsel: van der
    last: Made
  role: msc
  company: bol.com
  year: 2022
  thesis: 'Box set optimization for e-commerce warehouses: Applied to bol.com'
  thesis-url: https://resolver.tudelft.nl/uuid:88c93d07-1614-4aaf-ae2c-86e548c6264c
  summary: Optimizes the dimensions of a small set of shipping boxes for e-commerce
    warehouses using simulated annealing, motivated by a case study at bol.com. Introduces
    an efficient pre-calculation table for fast objective evaluation, and demonstrates
    substantial reductions in total carton used and shipment volume compared to the
    existing box set.
  abstract: The problem considered in this thesis is the box set optimization problem.
    In this problem the goal is to find the optimal dimensions of a number of shipping
    boxes which have to provide an optimal fit on a set of items. The application
    considered is e-commerce, and hence the number of items is relatively large compared
    to other applications found in literature. The literature describes multiple problem
    formulations where a small number of optimal shipping boxes are selected from
    a large set containing candidate boxes. However, since the instances considered
    in e-commerce applications are often too large to be solved in this way, we introduce
    a simulated annealing heuristic solution method. In this way we are able to generate
    box sets containing 10 to 20 boxes with centimeter accuracy for data sets containing
    up to many single item orders. We pay special attention to an algorithm to very
    efficiently calculate the objective value associated to the fit of a selection
    of candidate boxes on a set of items. This is done by assigning items to shipping
    boxes using a pre-calculation table. Finally we generate multiple box sets based
    on the input data provided by the industry partner bol.com. We conclude that the
    total amount of carton used can be substantially reduced in combination with a
    reduction in total send volume in comparison with the box set that is currently
    used.
- name:
    first: Leonie
    last: Nipius
  role: msc
  year: 2022
  thesis: Encoding undirected and semi-directed binary phylogenetic networks by quarnets
  thesis-url: https://resolver.tudelft.nl/uuid:eaeb4293-6349-4d6e-ab53-94b781fc65e1
  summary: Proves that recoverable undirected and semi-directed binary level-2 phylogenetic
    networks are uniquely determined by their quarnets (four-leaf subnetworks). Also
    establishes decomposition theorems for undirected networks of all levels and semi-directed
    networks up to level-2.
  abstract: Phylogenetic networks generalize evolutionary trees and are commonly used
    to represent evolutionary relationships between species that undergo reticulate
    evolutionary processes such as hybridization, recombination and lateral gene transfer.
    In this thesis all quarnets, networks on four species, of a network are assumed
    to be known. We prove that each recoverable undirected or semi-directed binary
    level-2 phylogenetic network without redundant biconnected components is encoded
    by its set of quarnets, meaning that the network is uniquely determined by its
    quarnets. Furthermore, two decomposition theorems for undirected and semi-directed
    binary phylogenetic networks are presented. These decomposition theorems are proved
    for undirected binary phylogenetic networks for all levels and for semi-directed
    binary phylogenetic networks that are at most level-2.
- name:
    first: Teun
    last: Druijf
  role: msc
  year: 2022
  company: DB Cargo
  thesis: 'Optimizing Shunting Operations: A case-study at Kijfhoek shunting yard'
  thesis-url: https://resolver.tudelft.nl/uuid:e20191aa-4782-4686-85ae-5ff85adbf935
  summary: Optimizes shunting operations at Kijfhoek marshalling yard, the central
    hub for DB Cargo Nederland where roughly 2000 rail cars are sorted each week.
    Develops exact and heuristic algorithms that update plans as new information about
    arriving cars becomes available, achieving comparable solution quality to methods
    that assume full information from the start.
  abstract: In the current economy, there is an increasing focus on sustainability.
    Green transport solutions, like rail freight, are becoming more and more popular.
    We will look into the shunting operations at Kijfhoek shunting yard. This yard
    functions as the central hub for DB Cargo Nederland and connects the Port of Rotterdam
    with the hinterland. About 2000 cars are sorted at this yard each week. At the
    yard, there are 43 parallel classification tracks. Shunting problems come in many
    shapes and sizes but are generally hard to solve. To that end, we will use both
    exact algorithms and heuristics to solve the shunting problem at Kijfhoek within
    reasonable time. In practice, it is not known at the beginning of the planning
    horizon which cars will arrive. We create general solutions which will be updated
    over time when new information becomes available. We find that our solution approaches
    can generate solutions for instances with 28 classification tracks of similar
    quality as solutions found for the same instances with 43 classification tracks
    with complete information at the beginning of the planning horizon.
- name:
    first: Myrte
    tussenvoegsel: van
    last: Belkom
  role: msc
  company: NFI
  year: 2021
  thesis: Exploring deep learning to improve allelic peak calling in forensic DNA
    analysis
  thesis-url: https://resolver.tudelft.nl/uuid:f0a4d8ec-0d95-441c-ba35-65b087447929
  summary: Applies U-net neural networks to automate allelic peak identification in
    STR electropherograms from forensic DNA trace samples. Achieves 95% pixel-level
    accuracy and approaches analyst-level performance, demonstrating the potential
    of deep learning to assist forensic DNA profiling.
  abstract: When processing a trace DNA sample at the Netherlands Forensic Institute,
    an STR electropherogram can be created. An analyst uses this electropherogram
    and analysis software to read out peaks signifying DNA. After analysis, the DNA
    profile is used in the interpretation process, which can include the comparison
    to a reference DNA profile of a person of interest. The software that is currently
    being used for profile analysis is threshold-based and the process includes the
    intervention of trained analysts. To further automate (allelic) peak identification
    in STR electropherograms, as well as to increase efficiency and uniformity, neural
    networks were studied and applied. Previous work provided a proof of concept using
    a simple fully connected neural net. After reviewing literature, the U-net was
    selected for this thesis. Training U-net on electropherograms proved successful
    and achieved a 95% accuracy on the per-pixel labels. The upper bound on the score
    got close to an analyst's performance and demonstrated the potential of this method.
- name:
    first: Alexandre
    last: Simon
  role: msc
  year: 2021
  thesis: Algorithmic study of 2-interval graphs
  thesis-url: https://resolver.tudelft.nl/uuid:e899eff1-bd18-4007-bfbb-b57cdd893a81
  summary: Studies generalizations of interval graphs where vertices are represented
    by multiple intervals or intervals on multiple real lines (d-track graphs and
    t-interval graphs). Proves that most polynomial-time problems on interval graphs
    become NP-hard or APX-hard on these broader classes, and analyzes structural relationships
    between the resulting graph classes.
  abstract: Interval graphs play an important role in graph theory and have intensively
    been studied for over sixty years due to their wide range of applications and
    because most NP-hard problems on general graphs become solvable in linear time
    on interval graphs. However, the class of interval graphs is restricted and does
    not even contain a cycle of length 4. To overcome this drawback, we study some
    generalisations of interval graphs where instead of considering one interval on
    one real line for each vertex we consider d intervals on d different real lines
    and take the union of each line (d-track graphs) or t intervals on the same real
    line (t-interval graphs). Most problems now become NP-hard, as shown for Vertex
    Cover, Clique Cover, Biclique Cover, or even APX-hard in the case of Feedback
    Vertex Set. This is even the case if we add some restrictions on the length of
    the intervals. We also give a bound on the unit track number of any interval graph.
    Furthermore, we study the relationship between the classes of d-track graphs and
    t-interval graphs with and without length restrictions, and consider boxicity-d
    graphs.
- name:
    first: Frank
    last: Janisse
  role: msc
  year: 2021
  thesis: Encoding level-k phylogenetic networks
  thesis-url: https://resolver.tudelft.nl/uuid:11939b58-b834-4073-8de8-b61d9a5f9a81
  summary: Advances encoding theory for phylogenetic networks, proving that level-k
    networks without symmetry are uniquely determined by their (k+1)-nets, and extending
    the result to symmetric networks under certain conditions. Presents an algorithm
    to verify encoding properties, supporting the conjecture that all level-k networks
    are encoded by their (k+1)-nets.
  abstract: Phylogenetic networks are used to describe evolutionary histories and
    are a generalisation of evolutionary trees. They can contain so-called reticulations,
    representing reticulate evolution, such as hybridization, lateral gene transfer
    and recombination. Methods are being developed to construct certain rooted phylogenetic
    networks from their subnetworks. A constructed network is encoded by their subnetworks
    if it is uniquely determined by that set. It has been shown that phylogenetic
    trees are encoded by their set of triplets, and that level-1 networks are encoded
    by trinets (rooted networks on three species). Van Iersel and Moulton proved that
    level-2 networks are encoded by their set of trinets. In this thesis we prove
    that for all k>1, level-k networks without symmetry in their biconnected components
    are encoded by their set of (k+1)-nets. This result provides evidence for the
    conjecture that all level-k phylogenetic networks are encoded by their set of
    (k+1)-nets. We further prove encoding results for networks with symmetry under
    certain conditions, and prove that level-4 networks are encoded by 6-nets. We
    also provide an algorithm to verify encoding properties, supporting the main conjecture.
- name:
    first: Simon
    tussenvoegsel: van
    last: Oosterom
  role: msc
  company: NLR
  year: 2021
  thesis: Investment Optimized Airport Infrastructure for Battery and Hydrogen Canister
    Swaps
  thesis-url: https://resolver.tudelft.nl/uuid:237762d9-6feb-42e9-b513-23bcba5055d7
  summary: Optimizes airport infrastructure investment for next-generation electric
    and hydrogen aircraft, determining cost-effective numbers of batteries, chargers,
    hydrogen canisters, and fueling points via mixed integer linear programming. Includes
    extensions for slot allocation, multiple battery types, time-dependent electricity
    pricing, and energy storage, with case studies at Schiphol and Rotterdam-The Hague
    airports.
  abstract: In this thesis, we consider investment optimization for airport infrastructure
    required to charge and refuel electric and hydrogen powered aircraft using battery
    and hydrogen canister swaps respectively. The task at hand is to determine the
    most cost-effective infrastructure, consisting of spare batteries and battery
    chargers for electric aircraft, and spare hydrogen canisters and fueling points
    for hydrogen aircraft. Previously developed models are expanded upon by introducing
    the possibility of slot allocation, where flights that are not yet in possession
    of landing and take-off rights are assigned to them in such a way that requires
    the smallest extra infrastructure to be acquired. We derive several (mixed) integer
    linear programming formulations to solve this problem and develop heuristics which
    are able to approximate the optimal solution. Extensions include instances where
    more than one battery type is allowed, electricity pricing becomes dependent on
    the time-of-use, and storage of electricity at the airport is allowed. We found
    that exact solutions can be found within reasonable time for cases with up to
    200 batteries, and a first-in-first-out policy heuristic has shown to be capable
    of generating promising results while being applicable to larger instances. The
    models have been illustrated in a case study at the airports Schiphol (Amsterdam)
    and Zestienhoven (Rotterdam-The Hague).
- name:
    first: Rosanne
    last: Wallin
  role: msc
  company: VU
  year: 2020
  thesis: Applicability of phylogenetic network algorithms for representing the evolutionary
    history of SARS-CoV-2
  thesis-url: https://github.com/rosanneandrea/corona-networks
  summary: Develops a workflow for constructing phylogenetic networks representing
    the evolutionary history of SARS-CoV-2, applying multiple algorithms (TriLoNet,
    TriL2Net, Tree-Child, Semi-Temporal) to filtered sets of phylogenetic trees. Finds
    no evidence that SARS-CoV-2 is itself a recombinant virus, while confirming a
    previously described recombination event in an ancestor of the SARS-CoV-2/RaTG13
    lineage.
- name:
    first: Jasper
    tussenvoegsel: van
    last: Bemmelen
  role: msc
  company: VU
  year: 2020
  thesis: Reconstructing tree-child networks from their exhibited trinets
  thesis-url: https://www.ubvu.vu.nl/scripties/getpdf.cfm?facid=27&id=21599
  summary: Studies the reconstruction of tree-child phylogenetic networks from the
    trinets (three-leaf subnetworks) they display, characterizing which tree-child
    networks can be uniquely recovered from their trinets and developing reconstruction
    algorithms.
- name:
    first: Bryan
    last: Versendaal
  role: msc
  year: 2020
  thesis: Improving algorithms in phylogenetics using machine learning
  thesis-url: https://resolver.tudelft.nl/uuid:83690896-2783-4340-8b02-11a23d82e9f9
  summary: 'Applies machine learning to improve three phylogenetic algorithms: the
    maximum agreement forest problem, the hybridization number problem, and the tail
    move problem. Demonstrates that learning-guided approaches benefit the MAF and
    tail move algorithms, and provides a faster implementation for the hybridization
    number problem.'
  abstract: In this thesis we look at three different algorithms within the field
    of phylogenetics and create a proof of concept for using machine learning to improve
    the algorithms. The problems are the maximum agreement forest problem, the hybridization
    number problem and the tail move problem. A study of the problems shows that they
    can all benefit from machine learning. For each of the problems we find a machine
    learning implementation using basic decision trees. The results show that the
    MAF problem and the tail move problem can both benefit from machine learning,
    and for the hybridization number problem we give an implementation that is faster
    than the studied algorithm.
- name:
    first: Sjors
    last: Kole
  role: msc
  year: 2020
  thesis: Constructing level-2 phylogenetic networks from trinets
  thesis-url: https://resolver.tudelft.nl/uuid:c699ea63-f8c8-40f7-8f07-11ac055c42e0
  summary: Extends the TriLoNet algorithm to level-2 phylogenetic networks by developing
    TriL2Net, which assembles level-2 trinets into complete networks. Shows improved
    performance over TriLoNet on level-1 data, and produces networks at least as consistent
    with real sequence data when applied to datasets with recombination.
  abstract: Phylogenetic networks are a generalization of evolutionary trees that
    can be used to represent reticulate events. Level-k phylogenetic networks are
    such networks, but with at most k reticulations per biconnected component of the
    network. For level-1 networks there exists an algorithm, called TriLoNet, that
    constructs these networks directly from sequence alignments by piecing together
    smaller level-1 networks on three taxa. Here, we introduce TriL2Net, an algorithm
    similar to TriLoNet that works for the larger class of level-2 networks. More
    specifically, TriL2Net constructs a level-2 phylogenetic network from a set of
    level-2 trinets. We show that TriL2Net performs better on sampled level-2 networks
    than TriLoNet performs on sampled level-1 networks. Moreover, we applied TriL2Net
    to level-1 trinet sets derived from real sequence data involving recombination.
    When comparing the networks generated by TriL2Net from these data sets to the
    networks generated by TriLoNet, we found that TriL2Net's networks are at least
    as consistent with the input as TriLoNet's networks.
- name:
    first: Sander
    last: Borst
  role: msc
  year: 2020
  thesis: New FPT algorithms for finding the temporal hybridization number for sets
    of phylogenetic trees
  thesis-url: https://resolver.tudelft.nl/uuid:2697da91-c596-48d1-9f09-f21da02ddb54
  summary: Develops new fixed-parameter tractable algorithms for computing the temporal
    hybridization number of a set of phylogenetic trees — the minimum number of reticulations
    in a temporal network that simultaneously displays all input trees — achieving
    improved running times over earlier approaches.
  abstract: We study the problem of finding a temporal hybridization network for a
    set of phylogenetic trees that minimizes the number of reticulations. First, we
    introduce an FPT algorithm for this problem on an arbitrary set of t binary trees
    with n leaves each, with a running time of O(5^k * n * m) where k is the minimum
    temporal hybridization number. We also present the concept of temporal distance,
    which is a measure for how close a tree-child network is to being temporal. We
    then introduce an algorithm for computing a tree-child network with temporal distance
    at most p and at most k reticulations in O((8k)^p * 5^k * n * m). Lastly, we introduce
    a O(6^k * k! * n) algorithm for computing a minimum temporal hybridization network
    for a set of two nonbinary trees.
- name:
    first: Mick
    tussenvoegsel: van
    last: Dijk
  role: msc
  company: Westerdijk Institute
  year: 2019
  thesis: Classifying Candida species using Mixed Integer Optimization based optimal
    classification trees
  thesis-url: https://repository.tudelft.nl/islandora/object/uuid%3A068ff836-099b-4abe-8d9e-cf96706169df?collection=education
  summary: Applies Mixed Integer Optimization to construct optimal classification
    trees for identifying Candida species from genomic data, with a focus on mitigating
    overfitting and improving interpretability compared to standard classification
    methods.
- name:
    first: Céline
    last: Swennenhuis
  role: msc
  year: 2018
  thesis: 'Parallel Machine Scheduling: with Partition Constraints'
  thesis-url: https://repository.tudelft.nl/islandora/object/uuid%3Ad8f71f9a-6b59-4b51-9fe5-b0a4358a0d7f?collection=education
  summary: Studies parallel machine scheduling problems with partition constraints,
    where jobs must be assigned to machines subject to feasibility restrictions, and
    develops algorithms for finding optimal or near-optimal schedules.
- name:
    first: Erica
    tussenvoegsel: van der
    last: Sar
  role: msc
  company: CQM, EVO-it
  year: 2018
  thesis: 'Multi-attribute vehicle routing problems: Exploring the limits of exact
    methods in practice'
  thesis-url: https://repository.tudelft.nl/islandora/object/uuid%3Aec15c141-289b-4a8d-ae76-652bae893ab4?collection=education
  summary: Investigates vehicle routing problems with multiple attributes (such as
    time windows, capacities, or multiple depots) and empirically evaluates the practical
    limits of exact solution methods, identifying problem scales and configurations
    where exact approaches remain tractable.
  abstract: 'The companies CQM and EVO-it work together to help many different companies
    with solving their vehicle routing problems. EVO-it provides the interface of
    the software that the companies can use for route planning and CQM provides the
    mathematical programming technology to solve the route planning problems. The
    difficulty of solving these problems is that real-life problems usually deal with
    multi-attribute vehicle routing problems, which are problems with multiple characteristics,
    such as time windows and vehicle restrictions. These attributes can vary a lot
    per company, making it a difficult task to provide the best solving method for
    all problem types. The goal of this project was to investigate the improvement
    possibilities of the current method used by CQM. In this thesis many different
    solving methods for the vehicle routing problem are evaluated and their qualities
    are discussed. Furthermore, information from the companies using the software
    of EVO-it is collected, providing an overview of the problem types occurring at
    these companies. This thesis also describes two exact methods for solving vehicle
    routing problems similar to the real-life problems occurring at EVO-it''s clients:
    one uses a three-index flow formulation and the other uses a set partitioning
    formulation based on Baldacci and Mingozzi. The latter method can solve instances
    with up to 40 orders and can deal with several complicated attributes, including
    capacity constraints, distance constraints, different types of costs, and heterogeneous
    vehicles.'
- name:
    first: Youri
    tussenvoegsel: van der
    last: Kuij
  role: bsc
  year: 2026
  thesis: Maximizing Quartet Profile Consistency for Level-1 Phylogenetic Networks
  thesis-url: https://resolver.tudelft.nl/uuid:57bf7fcb-1e6b-45a6-962c-0f7246cb99a8
  summary: Studies the problem of finding a level-1 phylogenetic network whose quartet
    profile is maximally consistent with an observed set of quartet profiles. Introduces
    an integer linear programming framework and proves structural constraints that
    valid level-1 networks must satisfy.
- name:
    first: Jari
    last: Brits
  role: bsc
  year: 2026
  thesis: Distinguishing phylogenetic trees from networks
  thesis-url: https://resolver.tudelft.nl/uuid:b515be05-f539-41d6-b57b-d23a0b4156e8
  summary: Investigates whether phylogenetic trinets (three-leaf subnetworks) can
    be distinguished from simpler tree structures using phylogenetic invariants —
    algebraic expressions relating DNA pattern probabilities. Shows that a specific
    trinet type can be distinguished from a tree using an invariant, contributing
    to the identifiability theory of phylogenetic networks.
- name:
    first: Guuske
    last: Kouwenhoven
  role: bsc
  year: 2025
  thesis: Identifiability of Phylogenetic Trinets
  thesis-url: https://resolver.tudelft.nl/uuid:5aa152f2-e99c-4bb8-bb27-c112ab50b5f4
  summary: Studies the identifiability of phylogenetic trinets under substitution
    models, investigating when these three-leaf subnetworks can be uniquely distinguished
    from one another and from phylogenetic trees on the basis of the data they generate.
- name:
    first: Simon
    last: Deuten
  role: bsc
  year: 2025
  thesis: Reconstructing Phylogenetic Networks Using Quarnet-Puzzling
  thesis-url: https://resolver.tudelft.nl/uuid:4b30854e-73c6-4cc4-beab-80299fc7f26e
  summary: Develops algorithms that reconstruct ranked phylogenetic networks from
    quarnets (four-leaf subnetworks) using a quarnet-puzzling approach, assembling
    local subnetwork information into a globally consistent network.
- name:
    first: Joachim
    tussenvoegsel: de
    last: Bosch Kemper
  role: bsc
  year: 2024
  thesis: Establishing Existence of Paths between Ranked Phylogenetic Networks
  thesis-url: https://resolver.tudelft.nl/uuid:ed1bfa42-2db3-4d1b-bddf-021fb84c4d95
  summary: Studies the existence of rearrangement paths between ranked phylogenetic
    networks — sequences of local moves that transform one network into another —
    establishing conditions under which two networks are connected in the rearrangement
    space.
- name:
    first: Tyren
    last: Koning
  role: bsc
  year: 2024
  company: TNO
  thesis: At a crossroads – Optimizing Markovian patrol strategies for perimeter defense
  thesis-url: https://resolver.tudelft.nl/uuid:84b31581-36d8-4665-9310-28e633c47c3e
  summary: Investigates the effect of an initial suboptimal cherry choice in the cherry-picking
    algorithm for phylogenetic network construction, measuring how such early mistakes
    propagate and affect the quality of the resulting network across networks of varying
    sizes.
- name:
    first: Bouke
    last: Hoekstra
  role: bsc
  year: 2024
  thesis: Reconstructing Phylogenetic Networks Using Cherry Picking
  thesis-url: https://resolver.tudelft.nl/uuid:28a81f86-ce16-4262-b81e-779c26bd1e95
  summary: Applies the cherry-picking algorithm to reconstruct phylogenetic networks
    from sets of phylogenetic trees, studying how the algorithm performs and what
    properties the resulting networks have.
- name:
    first: Merel
    tussenvoegsel: van
    last: Gruijthuijsen
  role: bsc
  year: 2023
  thesis: 'Forest-Based Binary Phylogenetic Networks: Finding Optimal Base Forests
    with Integer Linear Programming'
  thesis-url: https://resolver.tudelft.nl/uuid:ace16f6a-c08f-454d-8732-1e627dd89b32
  summary: Introduces a new polynomial for describing rooted binary internally labelled
    phylogenetic networks and trees, studying its properties including uniqueness,
    and provides an algorithm for determining when a monomial corresponds to a tree
    that can be folded into a network.
- name:
    first: Margot
    tussenvoegsel: van de
    last: Klok
  role: bsc
  year: 2022
  thesis: A new polynomial for describing Phylogenetic Networks
  thesis-url: https://resolver.tudelft.nl/uuid:c4ef44cf-cb0f-4912-8da1-1ba16f59f81e
  summary: Studies orchard phylogenetic networks using time-labelling of vertices,
    presents algorithms to recognize orchard networks and to transform non-orchard
    networks into orchard networks by performing local modifications.
- name:
    first: Merel
    last: Susanna
  role: bsc
  year: 2022
  thesis: 'Making phylogenetic networks orchard: Algorithms to determine if a phylogenetic
    network is orchard and to transform non-orchard to orchard networks'
  thesis-url: https://resolver.tudelft.nl/uuid:724ac2af-e569-4586-b367-288fef890252
  summary: Examines whether three reduction rules (chain reduction, generalized subtree
    reduction, and the (2,1,2)-reduction) preserve the bounded Maximum Parsimony distance
    on phylogenetic trees, proving two of them valid and providing a counterexample
    for the third.
- name:
    first: Elise
    last: Deen
  role: bsc
  year: 2021
  thesis: Different reduction rules for the Maximum Parsimony distance on phylogenetic
    trees
  thesis-url: https://resolver.tudelft.nl/uuid:0deb0697-bc1d-4cd9-96ed-f516872f24b0
  summary: Develops and implements an algorithm for reconstructing level-2 binary
    phylogenetic networks from their leaf distance matrices, based on theoretical
    results showing such networks are uniquely determined by these matrices. Tests
    the algorithm on over 35000 networks without errors.
- name:
    first: Riche
    last: Mol
  role: bsc
  year: 2020
  thesis: 'Reconstruction of Phylogenetic Networks: An algorithm for deconstructing
