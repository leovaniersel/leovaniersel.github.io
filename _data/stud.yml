  thesis: A Polynomial Time Test for when Optimal Traffic Flow is Achievable with
    Semi-Selfish Planners in Parallel Edge Networks
  thesis-url: https://resolver.tudelft.nl/uuid:800f3adb-523f-464c-80c2-e81d3aad753e
  summary: Studies a traffic-routing game in which semi-selfish planners (such as
    autonomous-vehicle coordinators) can suggest routes to their vehicles while still
    acting in their own interest. Characterizes exactly when this setting admits equilibria
    that achieve optimal overall traffic flow, and gives a polynomial-time algorithm
    to decide this for parallel-edge networks with convex cost functions.
