  thesis: Leveraging Data in Algorithm Design
  thesis-url: https://doi.org/10.4233/uuid:3df57b28-1976-4d62-a483-2c513e062d89
  website:
  scholar: https://scholar.google.nl/citations?user=qyOapq8AAAAJ
  summary: Investigates how machine learning can be integrated into algorithm design
    for hard combinatorial optimization problems in bilevel optimization, two-stage
    robust optimization, and phylogenetics. Proposes learning approaches based on
    efficient training data schemes that exploit sub-problem solutions rather than
    requiring optimal solutions to many similar instances.
  abstract: This thesis explores the integration of machine learning (ML) into algorithm
    design for solving complex combinatorial optimization problems. We focus on solving
    problems that arise in bilevel optimization, two-stage robust optimization, and
    phylogenetics. Although these problem classes seem vastly different, they share
    the common characteristic of being extremely challenging to solve. Current solution
    methods for these problems are computationally heavy and their solving duration
    is often impractical for already small-sized instances. Adding a component of
    machine learning also adds complexity. We primarily attempt to mitigate this effect
    by proposing learning methods that utilize efficient training data generation
    schemes that rely on solving sub-problems or are even based on a simple procedure,
    instead of learning from optimal solutions of many instances similar to the target
    problem.
- name:
    first: Yukihiro
    last: Murakami
  role: phd
  year: 2021
  thesis: On Phylogenetic Encodings and Orchard Networks
  thesis-url: https://doi.org/10.4233/uuid:049932ab-4124-4639-a7e3-146ac4fd805d
  website: https://www.tudelft.nl/ewi/over-de-faculteit/afdelingen/applied-mathematics/people/dr-y-yuki-murakami
  scholar: https://scholar.google.nl/citations?user=JCRspVQAAAAJ
  summary: Studies encodings of phylogenetic networks — substructures such as displayed
    trees, splits, or distance matrices that uniquely determine a network within a
    given class. Proves encoding results for orchard networks and related classes,
    and develops polynomial-time reconstruction algorithms based on these results.
  abstract: Phylogenetic networks are a type of graph with vertices and edges, used
    to elucidate the evolutionary history of species. The fundamental goal of phylogenetic
    research is to infer the true phylogeny of species from raw data such as DNA sequences
    and morphological data. Most network inference methods require one to solve an
    NP-hard problem; furthermore, there is generally no guarantee of a unique network.
    One way of resolving this is to restrict our scope to networks within a certain
    class and to ask the following question. What input data guarantees a unique network
    within this class? Such a question brings us to the idea of encodings. A network
    class is encoded by a certain building block, such as displayed trees, splits,
    or induced inter-taxa distance matrices, if the building block distinguishes one
    network in the class from another. More precisely, no two networks in the same
    class may have the same set of building blocks. Often, encoding results give inspiration
    for polynomial-time algorithms for inferring networks within certain classes.
    Assuming to have data that corresponds to a network in that class, one may plausibly
    construct it as the unique network that is consistent with such information.
