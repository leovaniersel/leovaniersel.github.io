  thesis: 'Dense Reachable Subgraphs: Hardness, Algorithms and Experiments'
  thesis-url: https://resolver.tudelft.nl/uuid:bb772d2a-f919-498d-98ad-6fc41456ef4d
  summary: 'Introduces two optimization problems on vertex-weighted multilayer graphs
    motivated by money laundering detection: finding dense reachable subgraphs that
    maximize the ratio of total vertex weight to neighborhood size. Proves NP-hardness
    via reduction from Vertex Cover, provides MILP exact formulations, and develops
    greedy heuristics.'
- name:
    first: Tim
    last: Levert
  role: msc
  year: 2025
  thesis: Triplet Encoding of Stemmata
  thesis-url: https://resolver.tudelft.nl/uuid:a590255b-06dd-4f56-a905-c2f41705f525
  summary: Extends triplet-based encoding and reconstruction from phylogenetics to
    internally labelled trees and networks, motivated by stemmatology (the study of
    manuscript genealogy). Proves that complete sets of rooted triplets uniquely determine
    multifurcating trees, general rooted trees, and level-1 networks with internal
    labels, and provides polynomial-time reconstruction algorithms for each class.
