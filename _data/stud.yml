  summary: Addresses scheduling in semiconductor photolithography, where the order
    in which circuit patterns are exposed onto wafers determines total blade travel.
    Formulates the ordering problem as equivalent to the a priori travelling salesman
    problem, and uses integer linear programming to achieve roughly a 20% reduction
    in blade movement.
