  summary: Introduces WhatsHap, a fixed-parameter dynamic-programming approach to
    weighted haplotype assembly. The method solves the weighted minimum error correction
    problem efficiently for future-generation sequencing reads when coverage is moderate.
  bibtex: |
    @article{patterson2015whatshap,
      author = {Patterson, Murray and Marschall, Tobias and Pisanti, Nadia and van Iersel, Leo and Stougie, Leen and Klau, Gunnar W and Schoenhuth, Alexander},
      title = {{WhatsHap: Weighted Haplotype Assembly for Future-Generation Sequencing Reads}},
      journal = {Journal of Computational Biology},
      year = {2015},
      volume = {22},
      number = {6},
      pages = {498--509}
    }
  abstract: The human genome is diploid, which requires assigning heterozygous single
    nucleotide polymorphisms (SNPs) to the two copies of the genome. The resulting
    haplotypes, lists of SNPs belonging to each copy, are crucial for downstream analyses
    in population genetics. Currently, statistical approaches, which are oblivious
    to direct read information, constitute the state-of-the-art. Haplotype assembly,
    which addresses phasing directly from sequencing reads, suffers from the fact
    that sequencing reads of the current generation are too short to serve the purposes
    of genome-wide phasing. While future-technology sequencing reads will contain
    sufficient amounts of SNPs per read for phasing, they are also likely to suffer
    from higher sequencing error rates. Currently, no haplotype assembly approaches
    exist that allow for taking both increasing read length and sequencing error information
    into account. Here, we suggest WhatsHap, the first approach that yields provably
    optimal solutions to the weighted minimum error correction problem in runtime
    linear in the number of SNPs. WhatsHap is a fixed parameter tractable (FPT) approach
    with coverage as the parameter. We demonstrate that WhatsHap can handle datasets
    of coverage up to 20×, and that 15× are generally enough for reliably phasing
    long reads, even at significantly elevated sequencing error rates. We also find
    that the switch and flip error rates of the haplotypes we output are favorable
    when comparing them with state-of-the-art statistical phasers.
