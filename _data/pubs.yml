  summary: Gives a faster brute-force-beating algorithm for exactly computing the
    minimum number of hybridization events needed to reconcile two conflicting evolutionary
    trees, guaranteed to finish in a time that scales predictably with the number
    of species even in the worst case.
  bibtex: |
