    enabling this measure to actually be computed and used on realistically sized
    evolutionary networks.
  bibtex: |
    @article{holtgrefe2026exact,
      author = {Holtgrefe, Niels and van Iersel, Leo and Jones, Mark},
      title = {Exact and heuristic computation of the scanwidth of directed acyclic graphs},
      journal={Journal of Computer and System Sciences},
      doi={10.1016/j.jcss.2026.103802},
      volume = {160},
      pages = {103802},
      year = {2026}
    }
  abstract: 'To measure the tree-likeness of a directed acyclic graph (DAG), a new
    width parameter that considers the directions of the arcs was recently introduced:
    scanwidth. We present the first algorithm that efficiently computes the exact
    scanwidth of general DAGs. For DAGs with one root and scanwidth $k$ it runs in
    $O(k \cdot n^k \cdot m)$ time. The algorithm also functions as an FPT algorithm
    with complexity $O(2^{4 \ell - 1} \cdot \ell \cdot n + n^2)$ for phylogenetic
    networks of level-$\ell$, a type of DAG used to depict evolutionary relationships
    among species. Our algorithm performs well in practice, being able to compute
    the scanwidth of synthetic networks up to 30 reticulations and 100 leaves within
    500 seconds. Furthermore, we propose a heuristic that obtains an average practical
    approximation ratio of 1.5 on these networks. While we prove that the scanwidth
    is bounded from below by the treewidth of the underlying undirected graph, experiments
    suggest that for networks the parameters are close in practice.'
