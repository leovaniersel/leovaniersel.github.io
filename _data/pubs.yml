  summary: Addresses the practical difficulty that accurately determining the root
    (the starting point in time) of an evolutionary tree is notoriously hard, by
    studying versions of key network-reconstruction problems that don't require
    knowing the root in advance — showing that some of these relaxed problems remain
    efficiently solvable while others become considerably harder, but can still be
    solved well even when the root is deliberately left flexible.
