  summary: Studies when it is possible to efficiently check whether a proposed evolutionary
    tree, or a proposed grouping of species, is consistent with a larger network,
    showing this can be done quickly for several well-behaved, biologically motivated
    network types, while confirming the problem remains computationally hard even
    for other fairly restricted and seemingly simple ones.
