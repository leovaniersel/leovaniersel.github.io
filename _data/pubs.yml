  preprint-url: https://arxiv.org/abs/2603.07000
  software-url:
  summary: Introduces classes of unrooted phylogenetic networks motivated by the algorithmic
    usefulness of rooted tree-child networks. The paper shows that recognizing tree-child-orientable
    networks is hard, proposes q-cuttable networks, proves recognizability properties,
    and gives tractability results for Tree Containment on suitable subclasses.
  bibtex: |
    @misc{iersel2026class,
      author = {van Iersel, Leo and Jones, Mark and Linz, Simone and Zeh, Norbert},
      title = {{A Class of Unrooted Phylogenetic Networks Inspired by the Properties of Rooted Tree-Child Networks}},
      year = {2026},
      archivePrefix = {arXiv},
      eprint = {2603.07000},
      doi = {10.48550/arXiv.2603.07000},
      url = {https://doi.org/10.48550/arXiv.2603.07000}
    }
  abstract: A directed phylogenetic network is tree-child if every non-leaf vertex
    has a child that is not a reticulation. As a class of directed phylogenetic networks,
    tree-child networks are very useful from a computational perspective. For example,
    several computationally difficult problems in phylogenetics become tractable when
    restricted to tree-child networks. At the same time, the class itself is rich
    enough to contain quite complex networks. Furthermore, checking whether a directed
    network is tree-child can be done in polynomial time. In this paper, we seek a
    class of undirected phylogenetic networks that is rich and computationally useful
    in a similar way to the class tree-child directed networks. A natural class to
    consider for this role is the class of tree-child-orientable networks which contains
    all those undirected phylogenetic networks whose edges can be oriented to create
    a tree-child network. However, we show here that recognizing such networks is
    NP-hard, even for binary networks, and as such this class is inappropriate for
    this role. Towards finding a class of undirected networks that fills a similar
    role to directed tree-child networks, we propose new classes called $q$-cuttable
    networks, for any integer $q\geq 1$. We show that these classes have many of the
    desirable properties, similar to tree-child networks in the rooted case, including
    being recognizable in polynomial time, for all $q\geq 1$. Towards showing the
    computational usefulness of the class, we show that the NP-hard problem Tree Containment
    is polynomial-time solvable when restricted to $q$-cuttable networks with $q\geq
    3$.
