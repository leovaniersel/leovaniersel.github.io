  summary: Proves a general result about a broad family of problems asking for the
    best possible ordering of a set of items subject to triple-wise preferences,
    including one relevant to combining conflicting evolutionary trees — whenever
    a solution is required to beat the average by some margin, the problem can always
    be reduced to an instance whose size grows only quadratically with that margin.
  bibtex: |
    @article{gutin2012every,
      author = {Gutin, Gregory and van Iersel, Leo and Mnich, Matthias and Yeo, Anders},
      title = {{Every Ternary Permutation Constraint Satisfaction Problem Parameterized Above Average Has a Kernel with a Quadratic Number of Variables}},
      journal = {Journal of Computer and System Sciences},
      year = {2012},
      volume = {78},
      pages = {151--163}
    }
  abstract: A ternary Permutation-CSP is specified by a subset $Π$ of the symmetric
    group $\mathcal S_3$. An instance of such a problem consists of a set of variables
    $V$ and a multiset of constraints, which are ordered triples of distinct variables
    of $V.$ The objective is to find a linear ordering $α$ of $V$ that maximizes the
    number of triples whose ordering (under $α$) follows a permutation in $Π$. We
    prove that all ternary Permutation-CSPs parameterized above average have kernels
    with quadratic numbers of variables.
