  summary: Gives efficient algorithms for finding the smallest possible network,
    consistent with a biologically motivated timing constraint, that reconciles a
    set of conflicting evolutionary trees, including a new way to measure how close
    an arbitrary network comes to satisfying that timing constraint, all backed by
    a working implementation tested experimentally.
  bibtex: |
    @article{borst2022new,
      author = {Borst, Sander and van Iersel, Leo and Jones, Mark and Kelk, Steven},
      title = {{New FPT algorithms for finding the temporal hybridization number for sets of phylogenetic trees}},
      journal = {Algorithmica},
      year = {2022},
      volume = {84},
      pages = {2050--2087}
    }
  abstract: We study the problem of finding a temporal hybridization network for a
    set of phylogenetic trees that minimizes the number of reticulations. First, we
    introduce an FPT algorithm for this problem on an arbitrary set of $m$ binary
    trees with $n$ leaves each with a running time of $O(5^k\cdot n\cdot m)$, where
    $k$ is the minimum temporal hybridization number. We also present the concept
    of temporal distance, which is a measure for how close a tree-child network is
    to being temporal. Then we introduce an algorithm for computing a tree-child network
    with temporal distance at most $d$ and at most $k$ reticulations in $O((8k)^d5^
    k\cdot n\cdot m)$ time. Lastly, we introduce a $O(6^kk!\cdot k\cdot n^2)$ time
    algorithm for computing a minimum temporal hybridization network for a set of
    two nonbinary trees. We also provide an implementation of all algorithms and an
    experimental analysis on their performance.
