  type: preprint
  journal:
  volume:
  issue:
  pages:
  note: arXiv:1312.1255 [q-bio.PE] (2013).
  doi-identifier: 10.7554/elife.21589.007
  doi-url: https://doi.org/10.7554/elife.21589.007
  preprint-server: arXiv
  preprint-identifier: '1312.1255'
  preprint-url: https://arxiv.org/abs/1312.1255
  software-url:
  summary: Shows that the hybridization number of two rooted phylogenetic trees can
    be computed in O*(2^n) time. The result also yields the same time bound for computing
    a maximum acyclic agreement forest.
  bibtex: |
    @misc{iersel2013short,
      author = {van Iersel, Leo and Kelk, Steven and Lekic, Nela and Stougie, Leen},
      title = {{A short note on exponential-time algorithms for hybridization number}},
      year = {2013},
      archivePrefix = {arXiv},
      eprint = {1312.1255},
      url = {https://arxiv.org/abs/1312.1255}
    }
  abstract: In this short note we prove that, given two (not necessarily binary) rooted
    phylogenetic trees T_1, T_2 on the same set of taxa X, where |X|=n, the hybridization
    number of T_1 and T_2 can be computed in time O^{*}(2^n) i.e. O(2^{n} poly(n)).
    The result also means that a Maximum Acyclic Agreement Forest (MAAF) can be computed
    within the same time bound.
