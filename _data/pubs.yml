  summary: Extends earlier work showing that a moderately tangled evolutionary network
    can be efficiently constructed from a sufficiently complete set of small three-species
    relationship hypotheses, by proving that even more complex networks can still
    be built this way in polynomial time when the input is complete enough, while
    confirming that the problem remains computationally hard whenever that information
    is incomplete.
