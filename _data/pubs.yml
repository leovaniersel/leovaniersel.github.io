  summary: Presents FHyNCH, software that combines a tree-simplification technique
    with machine learning to reconstruct evolutionary networks from large collections
    of trees, even when those trees are only partially resolved and cover different,
    overlapping sets of species — a scale and flexibility beyond what earlier methods
    could handle.
  bibtex: |
    @article{bernardini2024inferring,
      author = {Bernardini, Giulia and van Iersel, Leo and Julien, Esther and Stougie, Leen},
      title = {{Inferring Phylogenetic Networks from Multifurcating Trees via Cherry Picking and Machine Learning}},
      journal = {Molecular Phylogenetics and Evolution},
      year = {2024},
