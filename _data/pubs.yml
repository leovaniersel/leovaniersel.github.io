  summary: Presents TriLoNet, free software that reconstructs evolutionary networks
    directly from DNA sequence data by combining information from every possible
    group of three species, shown through simulations to avoid overestimating the
    number of hybridization events compared to an earlier competing method, and
    demonstrated on real recombining sequence data.
  bibtex: |
    @article{oldman2016trilonet,
      author = {Oldman, James and Wu, Taoyang and van Iersel, Leo and Moulton, Vincent},
      title = {{TriLoNet: Piecing together small networks to reconstruct reticulate evolutionary histories}},
      journal = {Molecular Biology and Evolution},
      year = {2016},
      volume = {33},
      number = {8},
      pages = {2151--2162}
    }
  abstract: Phylogenetic networks are a generalization of evolutionary trees that
    can be used to represent reticulate processes such as hybridization and recombination.
    Here, we introduce a new approach called TriLoNet (Trinet Level- one Network algorithm)
    to construct such networks directly from sequence alignments which works by piecing
    together smaller phylogenetic networks. More specifically, using a bottom up approach
    similar to Neighbor-Joining, TriLoNet constructs level-1 networks (networks that
    are somewhat more general than trees) from smaller level-1 networks on three taxa.
    In simulations, we show that TriLoNet compares well with Lev1athan, a method for
    reconstructing level-1 networks from three-leaved trees. In particular, in simulations
    we find that Lev1athan tends to generate networks that overestimate the number
    of reticulate events as compared with those generated by TriLoNet. We also illustrate
    TriLoNet's applicability using simulated and real sequence data involving recombination,
    demonstrating that it has the potential to reconstruct informative reticulate
    evolutionary histories. TriLoNet has been implemented in JAVA and is freely available
    at https://www.uea.ac.uk/computing/TriLoNet.
