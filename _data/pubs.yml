  summary: Proves that a natural measure of how much two evolutionary trees disagree,
    based on a limited number of possible character states, can always be efficiently
    simplified to a near-minimal instance before solving, extending an efficiency
    guarantee that was previously known only for a related, less restrictive version
    of the measure.
  bibtex: |
    @article{deen2024nearlinear,
      author = {Deen, Elise and van Iersel, Leo and Janssen, Remie and Jones, Mark and Murakami, Yukihiro and Zeh, Norbert},
      title = {{A near-linear kernel for bounded-state parsimony distance}},
      journal = {Journal of Computer and System Sciences},
      year = {2024},
      volume = {140},
      pages = {103477}
    }
  abstract: The maximum parsimony distance $d_{\textrm{MP}}(T_1,T_2)$ and the bounded-state
    maximum parsimony distance $d_{\textrm{MP}}^t(T_1,T_2)$ measure the difference
    between two phylogenetic trees $T_1,T_2$ in terms of the maximum difference between
    their parsimony scores for any character (with $t$ a bound on the number of states
    in the character, in the case of $d_{\textrm{MP}}^t(T_1,T_2)$). While computing
    $d_{\textrm{MP}}(T_1, T_2)$ was previously shown to be fixed-parameter tractable
    with a linear kernel, no such result was known for $d_{\textrm{MP}}^t(T_1,T_2)$.
    In this paper, we prove that computing $d_{\textrm{MP}}^t(T_1, T_2)$ is fixed-parameter
    tractable for all~$t$. Specifically, we prove that this problem has a kernel of
    size $O(k \lg k)$, where $k = d_{\textrm{MP}}^t(T_1, T_2)$. As the primary analysis
    tool, we introduce the concept of leg-disjoint incompatible quartets, which may
    be of independent interest.
