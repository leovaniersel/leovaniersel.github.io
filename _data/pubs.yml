  summary: Presents Lev1athan, freely available software that efficiently reconstructs
    a moderately complex evolutionary network from information about every possible
    group of three species, always running quickly and falling back to a simple
    tree when the data supports one, shown through extensive simulations and real
    biological data to perform well even when the input is noisy.
