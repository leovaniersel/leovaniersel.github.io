  abstract: Phylogenetic networks are used in biology to represent evolutionary histories.
    The class of orchard phylogenetic networks was recently introduced for their computational
    benefits, without any biological justification. Here, we show that orchard networks
    can be interpreted as trees with additional \emph{horizontal} arcs. Therefore,
    they are closely related to tree-based networks, where the difference is that
    in tree-based networks the additional arcs do not need to be horizontal. Then,
    we use this new characterization to show that the space of orchard networks is
    connected under the rNNI rearrangement move, with a diameter of at most $4kn+n\lceil
    \log_2(n) \rceil +2k+6n-8$.
