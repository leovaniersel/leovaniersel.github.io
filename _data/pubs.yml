  summary: Investigates parsimony-based methods for identifying recombination breakpoints
    in multiple sequence alignments. The paper formulates several optimization problems,
    gives fixed-parameter algorithms for binary characters, and tests them on simulated
    data.
  bibtex: |
    @misc{jones2019cutting,
      author = {Jones, Mark and Gambette, Philippe and van Iersel, Leo and Janssen, Remie and Kelk, Steven and Pardi, Fabio and Scornavacca, Celine},
      title = {{Cutting an alignment with Ockham’s razor}},
