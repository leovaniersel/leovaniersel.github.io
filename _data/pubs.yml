  summary: Introduces a set of basic edit operations for reshaping an evolutionary
    network step by step, proves that repeatedly applying them can turn any network
    into any other network of comparable or different complexity, and shows that
    these operations reduce to the well-known editing moves used for ordinary trees
    when applied to a tree-like network — providing a practical foundation for network
    search algorithms.
  bibtex: |
    @article{gambette2017rearrangement,
      author = {Gambette, Philippe and van Iersel, Leo and Jones, Mark and Lafond, Manuel and Pardi, Fabio and Scornavacca, Celine},
      title = {{Rearrangement moves on rooted phylogenetic networks}},
      journal = {PLoS Computational Biology},
      year = {2017},
      volume = {13},
      number = {8},
      pages = {e1005611}
    }
  abstract: Phylogenetic tree reconstruction is usually done by local search heuristics
    that explore the space of the possible tree topologies via simple rearrangements
    of their structure. Tree rearrangement heuristics have been used in combination
    with practically all optimization criteria in use, from maximum likelihood and
    parsimony to distance-based principles, and in a Bayesian context. Their basic
    components are rearrangement moves that specify all possible ways of generating
    alternative phylogenies from a given one, and whose fundamental property is to
    be able to transform, by repeated application, any phylogeny into any other phylogeny.
    Despite their long tradition in tree-based phylogenetics, very little research
    has gone into studying similar rearrangement operations for phylogenetic network-that
    is, phylogenies explicitly representing scenarios that include reticulate events
    such as hybridization, horizontal gene transfer, population admixture, and recombination.
    To fill this gap, we propose "horizontal" moves that ensure that every network
    of a certain complexity can be reached from any other network of the same complexity,
    and "vertical" moves that ensure reachability between networks of different complexities.
    When applied to phylogenetic trees, our horizontal moves-named rNNI and rSPR-reduce
    to the best-known moves on rooted phylogenetic trees, nearest-neighbor interchange
    and rooted subtree pruning and regrafting. Besides a number of reachability results-separating
    the contributions of horizontal and vertical moves-we prove that rNNI moves are
    local versions of rSPR moves, and provide bounds on the sizes of the rNNI neighborhoods.
    The paper focuses on the most biologically meaningful versions of phylogenetic
    networks, where edges are oriented and reticulation events clearly identified.
    Moreover, our rearrangement moves are robust to the fact that networks with higher
    complexity usually allow a better fit with the data. Our goal is to provide a
    solid basis for practical phylogenetic network reconstruction.
