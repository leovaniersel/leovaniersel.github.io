  summary: Shows that a well-behaved class of evolutionary network can always be
    uniquely and efficiently reconstructed just from the collection of simpler networks
    obtained by removing one hybridization connection at a time, as long as the network
    is not too simple to begin with.
  bibtex: |
    @article{murakami2019reconstructing,
      author = {Murakami, Yukihiro and van Iersel, Leo and Janssen, Remie and Jones, Mark and Moulton, Vincent},
