- title: On Computing the Maximum Parsimony Score of a Phylogenetic Network
  release-date:
  authors:
  - first: Mareike
    last: Fischer
  - first: Leo
    tussenvoegsel: van
    last: Iersel
  - first: Steven
    last: Kelk
  - first: Celine
    last: Scornavacca
  year: 2015
  type: journal
  journal: SIAM Journal on Discrete Mathematics
  volume: '29'
  issue: '1'
  pages: 559--585
  note: SIAM Journal on Discrete Mathematics, 29(1):559-585 (2015). arXiv.
  doi-identifier: 10.1137/140959948
  doi-url: https://doi.org/10.1137/140959948
  preprint-server: arXiv
  preprint-identifier: '1302.2430'
  preprint-url: https://arxiv.org/abs/1302.2430
  software-url:
  summary: Studies computation of the maximum parsimony score of a phylogenetic network.
    The paper analyzes algorithms and complexity for scoring networks against character
    data under parsimony.
  bibtex: |
    @article{fischer2015computing,
      author = {Fischer, Mareike and van Iersel, Leo and Kelk, Steven and Scornavacca, Celine},
      title = {{On Computing the Maximum Parsimony Score of a Phylogenetic Network}},
      journal = {SIAM Journal on Discrete Mathematics},
      year = {2015},
      volume = {29},
      number = {1},
      pages = {559--585}
    }
  abstract: Phylogenetic networks are used to display the relationship of different
    species whose evolution is not treelike, which is the case, for instance, in the
    presence of hybridization events or horizontal gene transfers. Tree inference
    methods such as Maximum Parsimony need to be modified in order to be applicable
    to networks. In this paper, we discuss two different definitions of Maximum Parsimony
    on networks, "hardwired" and "softwired", and examine the complexity of computing
    them given a network topology and a character. By exploiting a link with the problem
    Multicut, we show that computing the hardwired parsimony score for 2-state characters
    is polynomial-time solvable, while for characters with more states this problem
    becomes NP-hard but is still approximable and fixed parameter tractable in the
    parsimony score. On the other hand we show that, for the softwired definition,
    obtaining even weak approximation guarantees is already difficult for binary characters
    and restricted network topologies, and fixed-parameter tractable algorithms in
    the parsimony score are unlikely. On the positive side we show that computing
    the softwired parsimony score is fixed-parameter tractable in the level of the
    network, a natural parameter describing how tangled reticulate activity is in
    the network. Finally, we show that both the hardwired and softwired parsimony
    score can be computed efficiently using Integer Linear Programming. The software
    has been made freely available.
- title: How much information is needed to infer reticulate evolutionary histories?
  release-date:
  authors:
  - first: Katharina
    last: Huber
  - first: Leo
