  summary: Studies the limitations of using clusters to characterize and reconstruct
    phylogenetic networks. The paper analyzes when cluster information fails to determine
    the underlying network.
  bibtex: |
    @article{kelk2012elusiveness,
      author = {Kelk, Steven and Scornavacca, Celine and van Iersel, Leo},
