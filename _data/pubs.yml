      journal = {The Electronic Journal of Combinatorics},
      year = {2017},
      volume = {24},
      number = {2},
      pages = {P2.47}
    }
  abstract: 'In 2008 Amanatidis, Green and Mihail introduced the Joint Degree Matrix
    (JDM) model to capture the fundamental difference in assortativity of networks
    in nature studied by the physical and life sciences and social networks studied
    in the social sciences. In 2014 Czabarka proposed a direct generalization of the
    JDM model, the Partition Adjacency Matrix (PAM) model. In the PAM model the vertices
    have specified degrees, and the vertex set itself is partitioned into classes.
    For each pair of vertex classes the number of edges between the classes in a graph
    realization is prescribed. In this paper we apply the new {\em skeleton graph}
    model to describe the same information as the PAM model. Our model is more convenient
    for handling problems with low number of partition classes or with special topological
    restrictions among the classes. We investigate two particular cases in detail:
    (i) when there are only two vertex classes and (ii) when the skeleton graph contains
    at most one cycle.'
