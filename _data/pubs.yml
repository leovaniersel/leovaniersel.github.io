  summary: Studies undirected orchard phylogenetic networks, a network class related
    to tree-like histories augmented by horizontal transfer. The paper proves hardness
    of recognizing undirected orchard networks and introduces a characterization useful
    for future algorithmic work.
  bibtex: |
