  summary: Compares the approximability of hybridization number and directed feedback
    vertex set through the cycle killer problem. The paper analyzes approximation-preserving
    relationships among these problems.
  bibtex: |
    @article{kelk2012cycle,
      author = {Kelk, Steven and van Iersel, Leo and Lekic, Nela and Linz, Simone and Scornavacca, Celine and Stougie, Leen},
