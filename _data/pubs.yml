  summary: Shows that, even in a fairly simple setting, finding which single evolutionary
    tree embedded within a larger network best explains a given set of aligned DNA
    sequences — whether by a parsimony or a likelihood criterion — is computationally
    hard in general, though the paper also explains why both criteria can often still
    be solved well in practice.
  bibtex: |
    @article{kelk2019finding,
      author = {Kelk, Steven and Pardi, Fabio and Scornavacca, Celine and van Iersel, Leo},
      title = {{Finding a most parsimonious or likely tree in a network with respect to an alignment}},
      journal = {Journal of Mathematical Biology},
