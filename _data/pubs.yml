  summary: Develops polynomial invariants for cactus-like phylogenetic networks. The
    paper uses algebraic tools to distinguish network structures and analyze identifiability
    for this class.
  bibtex: |
    @article{iersel2023polynomial,
      author = {van Iersel, Leo and Moulton, Vincent and Murakami, Yukihiro},
      title = {{Polynomial invariants for cactuses}},
