  software-url:
  summary: Studies Tree Containment for rooted phylogenetic networks through the structural
    parameter scanwidth. The paper gives a parameterized algorithm using a supplied
    tree-extension and proves a near-matching ETH-based lower bound in terms of directed
    cutwidth.
  bibtex: |
    @misc{iersel2026tree,
      author = {van Iersel, Leo and Jones, Mark and Weller, Mathias},
      title = {{Tree Containment Parameterized by Scanwidth}},
      year = {2026},
      archivePrefix = {arXiv},
      eprint = {2605.31071},
      doi = {10.48550/arXiv.2605.31071},
      url = {https://doi.org/10.48550/arXiv.2605.31071}
    }
  abstract: TREE CONTAINMENT is a central decision problem in mathematical phylogenetics,
    asking whether a given rooted phylogenetic tree is embeddable in ("displayed by")
    a given rooted phylogenetic network. While the problem is NP-complete for general
    networks, many algorithmic advances have relied on structural parameters that
    capture how "tree-like" a network is. In this paper we investigate TREE CONTAINMENT
    under the structural parameter scanwidth, a directed width measure generalizing
    popular parameters measuring tree-likeness of phylogenetic networks. We first
    present a parameterized algorithm that solves the problem in $O(4^{k + k\log{k}}
    n + nm^2)$ time, where $n$ and $m$ are the numbers of nodes and arcs in the network
    and $k$ is the width of a given tree-extension. Complementing this upper bound,
    we prove a matching lower bound under the Exponential-Time Hypothesis (ETH), showing
    that there is no algorithm for TREE CONTAINMENT that runs in $2^{o(c\log{c})}
    n^{O(1)}$ time, even on binary inputs, where $c$ is the directed cutwidth of the
    input network, which upper-bounds the scanwidth $k$.
