    while the network's coarse overall structure remains always recoverable — results
    that underpin the reliability of practical reconstruction software such as Squirrel.
  bibtex: |
    @article{huber2025when,
      author = {Huber, Katharina T and van Iersel, Leo and Jones, Mark and Moulton, Vincent and Veenema-Nipius, Leonie},
      title = {{When are quarnets sufficient to reconstruct semi-directed phylogenetic networks?}},
      journal = {Bulletin of Mathematical Biology},
      year = {2025},
      volume = {87},
      pages = {136}
    }
  abstract: Phylogenetic networks are graphs that are used to represent evolutionary
    relationships between different taxa. They generalize phylogenetic trees since
    for example, unlike trees, they permit lineages to combine. Recently, there has
    been rising interest in semi-directed phylogenetic networks, which are mixed graphs
    in which certain lineage combination events are represented by directed edges
    coming together, whereas the remaining edges are left undirected. One reason to
    consider such networks is that it can be difficult to root a network using real
    data. In this paper, we consider the problem of when a semi-directed phylogenetic
    network is defined or encoded by the smaller networks that it induces on the 4-leaf
    subsets of its leaf set. These smaller networks are called quarnets. We prove
    that semi-directed binary level-2 phylogenetic networks are encoded by their quarnets,
    but that this is not the case for level-3. In addition, we prove that the so-called
    blob tree of a semi-directed binary network, a tree that give the coarse-grained
    structure of the network, is always encoded by the quarnets of the network. These
    results are relevant for proving the statistical consistency of programs that
    are currently being developed for reconstructing phylogenetic networks from practical
    data, such as the recently developed Squirrel software tool.
