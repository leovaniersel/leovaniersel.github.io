  summary: Uses cherry-picking and machine learning to construct phylogenetic networks
    from multiple trees. The paper combines combinatorial network theory with predictive
    methods for practical network inference.
  bibtex: |
    @article{bernardini2023constructing,
      author = {Bernardini, Giulia and van Iersel, Leo and Julien, Esther and Stougie, Leen},
      title = {{Constructing Phylogenetic Networks via Cherry Picking and Machine Learning}},
