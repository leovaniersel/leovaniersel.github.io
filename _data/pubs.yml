  note: Algorithmica, 49(1):13-36 (2007). Preliminary version in WABI 2005, LNCS 3692:128-139.
  doi-identifier: 10.1007/s00453-007-0029-z
  doi-url: https://doi.org/10.1007/s00453-007-0029-z
  preprint-server:
  preprint-identifier:
  preprint-url:
  conference-note: WABI 2005, LNCS 3692:128–139
  conference-doi-url: https://doi.org/10.1007/11557067_11
  software-url:
  summary: Analyzes the computational complexity of the single-individual SNP haplotyping
    problem. The paper studies algorithmic difficulty in reconstructing haplotypes
    from SNP data for one individual.
  bibtex: |
    @article{cilibrasi2007complexity,
      author = {Cilibrasi, Rudi and van Iersel, Leo and Kelk, Steven and Tromp, John},
      title = {{The Complexity of the Single Individual SNP Haplotyping Problem}},
      journal = {Algorithmica},
      year = {2007},
      volume = {49},
      number = {1},
      pages = {13--36}
    }
  abstract: We present several new results pertaining to haplotyping. These results
    concern the combinatorial problem of reconstructing haplotypes from incomplete
    and/or imperfectly sequenced haplotype fragments. We consider the complexity of
    the problems Minimum Error Correction (MEC) and Longest Haplotype Reconstruction
    (LHR) for different restrictions on the input data. Specifically, we look at the
    gapless case, where every row of the input corresponds to a gapless haplotype-fragment,
    and the 1-gap case, where at most one gap per fragment is allowed. We prove that
    MEC is APX-hard in the 1-gap case and still NP-hard in the gapless case. In addition,
    we question earlier claims that MEC is NP-hard even when the input matrix is restricted
    to being completely binary. Concerning LHR, we show that this problem is NP-hard
    and APX-hard in the 1-gap case (and thus also in the general case), but is polynomial
    time solvable in the gapless case.
- title: A short note on exponential-time algorithms for hybridization number
  release-date:
  authors:
  - first: Leo
    tussenvoegsel: van
    last: Iersel
  - first: Steven
    last: Kelk
  - first: Nela
    last: Lekic
