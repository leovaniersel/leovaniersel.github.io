  summary: Shows that although a common type of evolutionary network cannot always
    be reconstructed from typical genetic distance data alone, it can be reconstructed
    reliably by combining two complementary kinds of distance information, and identifies
    exactly which such networks can already be recovered from the simpler kind of
    distance data by itself.
  bibtex: |
    @article{huber2022level2,
      author = {Huber, Katharina T and van Iersel, Leo and Janssen, Remie and Jones, Mark and Moulton, Vincent and Murakami, Yukihiro},
      title = {{Level-2 networks from shortest and longest distances}},
      journal = {Discrete Applied Mathematics},
      year = {2022},
      volume = {306},
      pages = {138--165}
    }
  abstract: Recently it was shown that a certain class of phylogenetic networks, called
    level-$2$ networks, cannot be reconstructed from their associated distance matrices.
    In this paper, we show that they can be reconstructed from their induced shortest
    and longest distance matrices. That is, if two level-$2$ networks induce the same
    shortest and longest distance matrices, then they must be isomorphic. We further
    show that level-$2$ networks are reconstructible from their shortest distance
    matrices if and only if they do not contain a subgraph from a family of graphs.
    A generator of a network is the graph obtained by deleting all pendant subtrees
    and suppressing degree-$2$ vertices. We also show that networks with a leaf on
    every generator side is reconstructible from their induced shortest distance matrix,
    regardless of level.
