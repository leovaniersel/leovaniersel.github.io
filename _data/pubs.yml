  summary: Introduces a powerful logical tool from theoretical computer science,
    not previously well known in this field, to give short and elegant proofs that
    several notoriously hard-to-compute measures of disagreement between evolutionary
    trees can nonetheless be computed efficiently whenever that disagreement is limited,
    demonstrating the broader potential of this tool for phylogenetics.
  bibtex: |
    @article{kelk2016phylogenetic,
      author = {Kelk, Steven and van Iersel, Leo and Scornavacca, Celine and Weller, Mathias},
      title = {{Phylogenetic incongruence through the lens of Monadic Second Order logic}},
      journal = {Journal of Graph Algorithms and Applications},
      year = {2016},
      volume = {20},
      number = {2},
      pages = {189--215}
    }
  abstract: Within the field of phylogenetics there is growing interest in measures
    for summarising the dissimilarity, or incongruence, of two or more phylogenetic
    trees. Many of these measures are NP-hard to compute and this has stimulated a
    considerable volume of research into fixed parameter tractable algorithms. In
    this article we use Monadic Second Order logic to give alternative, compact proofs
    of fixed parameter tractability for several well-known incongruence measures.
    In doing so we wish to demonstrate the considerable potential of MSOL - machinery
    still largely unknown outside the algorithmic graph theory community - within
    phylogenetics. A crucial component of this work is the observation that many measures,
    when bounded, imply the existence of an agreement forest of bounded size, which
    in turn implies that an auxiliary graph structure, the display graph, has bounded
    treewidth. It is this bound on treewidth that makes the machinery of MSOL available
    for proving fixed parameter tractability.
