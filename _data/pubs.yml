  abstract: Phylogenetic networks are well suited to represent evolutionary histories
    comprising reticulate evolution. Several methods aiming at reconstructing explicit
    phylogenetic networks have been developed in the last two decades. In this article,
    we propose a new definition of maximum parsimony for phylogenetic networks that
    permits to model biological scenarios that cannot be modeled by the definitions
    currently present in the literature (namely, the "hardwired" and "softwired" parsimony).
