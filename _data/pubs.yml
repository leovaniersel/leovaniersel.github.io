  summary: Investigates which evolutionary networks can be uniquely pieced back
    together from the smaller networks obtained by removing just one species at
    a time, showing that many practically important classes of networks — including
    ordinary trees and most moderately complex networks — can always be reconstructed
    this way, while leaving open whether this holds universally.
  bibtex: |
    @article{iersel2018leafreconstructibility,
      author = {van Iersel, Leo and Moulton, Vincent},
      title = {{Leaf-reconstructibility of phylogenetic networks}},
      journal = {SIAM Journal on Discrete Mathematics},
      year = {2018},
      volume = {32},
      number = {3},
      pages = {2047--2066}
    }
  abstract: An important problem in evolutionary biology is to reconstruct the evolutionary
    history of a set $X$ of species. This history is often represented as a phylogenetic
    network, that is, a connected graph with leaves labelled by elements in $X$ (for
    example, an evolutionary tree), which is usually also binary, i.e. all vertices
    have degree 1 or 3. A common approach used in phylogenetics to build a phylogenetic
    network on $X$ involves constructing it from networks on subsets of $X$. Here
    we consider the question of which (unrooted) phylogenetic networks are leaf-reconstructible,
    i.e. which networks can be uniquely reconstructed from the set of networks obtained
    from it by deleting a single leaf (its $X$-deck). This problem is closely related
    to the (in)famous reconstruction conjecture in graph theory but, as we shall show,
    presents distinct challenges. We show that some large classes of phylogenetic
    networks are reconstructible from their $X$-deck. This includes phylogenetic trees,
    binary networks containing at least one non-trivial cut-edge, and binary level-4
    networks (the level of a network measures how far it is from being a tree). We
    also show that for fixed $k$, almost all binary level-$k$ phylogenetic networks
    are leaf-reconstructible. As an application of our results, we show that a level-3
    network $N$ can be reconstructed from its quarnets, that is, 4-leaved networks
    that are induced by $N$ in a certain recursive fashion. Our results lead to several
    interesting open problems which we discuss, including the conjecture that all
    phylogenetic networks with at least five leaves are leaf-reconstructible.
