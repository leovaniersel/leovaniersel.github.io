- title: On Tree-Network Distinguishability and Full Identifiability of Phylogenetic
    Networks
  release-date:
  authors:
  - first: Jari
    last: Brits
  - first: Niels
    last: Holtgrefe
  - first: Leo
    tussenvoegsel: van
    last: Iersel
  - first: Samuel
    last: Martin
  year: 2026
  type: preprint
  journal:
  volume:
  issue:
  pages:
  note: "(2026). arXiv."
  doi-identifier: 10.48550/arXiv.2607.12919
  doi-url: https://doi.org/10.48550/arXiv.2607.12919
  preprint-server: arXiv
  preprint-identifier: '2607.12919'
  preprint-url: https://arxiv.org/abs/2607.12919
  software-url:
  summary: Proves full identifiability of level-1 phylogenetic networks under standard
    substitution models (JC, K2P, K3P), and shows that networks are generally distinguishable
    from trees via their leaf-pattern distributions.
  abstract: Phylogenetic networks generalize phylogenetic trees to evolutionary histories
    that include reticulate events such as recombination, horizontal gene transfer,
    and hybridization. Under a Markov model of nucleotide substitution, a phylogenetic
    network determines a distribution of leaf-patterns. Here, we study the identifiability
    of the network topology from this distribution under the Jukes-Cantor (JC), Kimura
    2-parameter (K2P), and Kimura 3-parameter (K3P) models. Our first result is that
    the semi-directed network parameter of a level-1 phylogenetic network (modulo
    redirecting triangles) is fully identifiable under all three models, on a biologically
    reasonable parameter space in which substitution rates are probabilistic and mixing
    parameters are non-trivial (i.e., not 0 or 1). In contrast to the generic identifiability
    established in prior work, this holds at every point of the parameter space, not
    merely off of a measure-zero subset. Our second result distinguishes phylogenetic
    networks from phylogenetic trees, on the same parameter space, under JC and K2P.
    We prove that no phylogenetic network and phylogenetic tree can induce the same
    leaf-pattern distribution unless the network is a tree, possibly augmented with
    certain substructures called 2-blobs. This means the presence of reticulate evolution
    creates, in most cases, a detectable signature in the leaf-pattern distribution.
    More broadly, these results have consequences for identifiability beyond the models
    and network classes studied here, including for several coalescent-based models.
  bibtex: |
