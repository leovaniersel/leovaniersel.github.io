  summary: Shows that two seemingly different and previously hard-seeming problems
    in reconstructing species histories from gene family trees — one involving gene
    duplication, one involving hybridization — can both surprisingly be solved efficiently
    using a shared underlying structure, while also cautioning that the optimal solutions
    these methods produce can be artificially restricted in form, and proposing a
    refined problem variant that avoids this pitfall while remaining efficiently
    solvable.
  bibtex: |
    @article{iersel2020polynomialtime,
      author = {van Iersel, Leo and Janssen, Remie and Jones, Mark and Murakami, Yukihiro and Zeh, Norbert},
      title = {{Polynomial-Time Algorithms for Phylogenetic Inference Problems involving duplication and reticulation}},
      journal = {IEEE/ACM Transactions on Computational Biology and Bioinformatics},
      year = {2020},
      volume = {17},
      number = {1},
      pages = {14--26}
    }
  abstract: A common problem in phylogenetics is to try to infer a species phylogeny
    from gene trees. We consider different variants of this problem. The first variant,
    called Unrestricted Minimal Episodes Inference, aims at inferring a species tree
    based on a model with speciation and duplication where duplications are clustered
    in duplication episodes. The goal is to minimize the number of such episodes.
    The second variant, Parental Hybridization, aims at inferring a species \emph{network}
    based on a model with speciation and reticulation. The goal is to minimize the
    number of reticulation events. It is a variant of the well-studied Hybridization
    Number problem with a more generous view on which gene trees are consistent with
    a given species network. We show that these seemingly different problems are in
    fact closely related and can, surprisingly, both be solved in polynomial time,
    using a structure we call "beaded trees". However, we also show that methods based
    on these problems have to be used with care because the optimal species phylogenies
    always have a restricted form. To mitigate this problem, we introduce a new variant
    of Unrestricted Minimal Episodes Inference that minimizes the duplication episode
    depth. We prove that this new variant of the problem can also be solved in polynomial
    time
