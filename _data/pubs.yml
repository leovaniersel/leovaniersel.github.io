  abstract: Orchards are a biologically relevant class of phylogenetic networks as
    they can describe treelike evolutionary histories augmented with horizontal transfer
    events. Moreover, the class has attractive mathematical characterizations that
    can be exploited algorithmically. On the other hand, undirected orchard networks
    have hardly been studied yet. Here, we prove that deciding whether an undirected,
    binary phylogenetic network is an orchard -- or equivalently, whether it has an
    orientation that makes it a rooted orchard -- is NP-hard. For this, we introduce
    a new characterization of undirected orchards which could be useful for proving
    positive results.
