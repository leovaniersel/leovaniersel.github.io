  summary: Studies the problem of finding a most parsimonious or most likely phylogenetic
    tree displayed by a network for a given alignment. The paper analyzes algorithms
    and complexity for optimizing tree explanations within a network.
  bibtex: |
    @article{kelk2019finding,
      author = {Kelk, Steven and Pardi, Fabio and Scornavacca, Celine and van Iersel, Leo},
      title = {{Finding a most parsimonious or likely tree in a network with respect to an alignment}},
      journal = {Journal of Mathematical Biology},
