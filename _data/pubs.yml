    possible well-behaved evolutionary network consistent with any number of given
    trees, together with a parallelized implementation that, unlike earlier approaches,
    can handle up to 100 input trees on an ordinary desktop computer.
  bibtex: |
    @article{iersel2022practical,
      author = {van Iersel, Leo and Janssen, Remie and Jones, Mark and Murakami, Yukihiro and Zeh, Norbert},
