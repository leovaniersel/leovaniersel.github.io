  summary: Introduces Squirrel, a method and software package for reconstructing semi-directed
    level-1 phylogenetic networks. The approach uses four-leaf subnetworks or sequence
    alignments and is designed for practical reconstruction from empirical data.
  bibtex: |
    @article{holtgrefe2025squirrel,
      title={Squirrel: Reconstructing semi-directed phylogenetic level-1 networks from four-leaved networks or sequence alignments},
      author={Holtgrefe, Niels and Huber, Katharina T and van Iersel, Leo and Jones, Mark and Martin, Samuel and Moulton, Vincent},
      journal={Molecular Biology and Evolution},
      doi={10.1093/molbev/msaf067},
      volume = {42},
      number = {4},
      pages = {msaf067},
      year = {2025}
    }
  abstract: 'With the increasing availability of genomic data, biologists aim to find
    more accurate descriptions of evolutionary histories influenced by secondary contact,
    where diverging lineages reconnect before diverging again. Such reticulate evolutionary
    events can be more accurately represented in phylogenetic networks than in phylogenetic
    trees. Since the root location of phylogenetic networks can not be inferred from
    biological data under several evolutionary models, we consider semi-directed (phylogenetic)
    networks: partially directed graphs without a root in which the directed edges
    represent reticulate evolutionary events. By specifying a known outgroup, the
    rooted topology can be recovered from such networks. We introduce the algorithm
    SO_SCPLOWQUIRRELC_SCPLOW (Semi-directed Quarnet-based Inference to Reconstruct
    Level-1 Networks) which constructs a semi-directed level-1 network from a full
    set of quarnets (four-leaf semi-directed networks). Our method also includes a
    heuristic to construct such a quarnet set directly from sequence alignments. We
    demonstrate SO_SCPLOWQUIRRELC_SCPLOWs performance through simulations and on real
    sequence data sets, the largest of which contains 29 aligned sequences close to
    1.7 Mbp long. The resulting networks are obtained on a standard laptop within
    a few minutes. Lastly, we prove that SO_SCPLOWQUIRRELC_SCPLOW is combinatorially
    consistent: given a full set of quarnets coming from a triangle-free semi-directed
    level-1 network, it is guaranteed to reconstruct the original network. SO_SCPLOWQUIRRELC_SCPLOW
    is implemented in Python, has an easy-to-use graphical user-interface that takes
    sequence alignments or quarnets as input, and is freely available at https://github.com/nholtgrefe/squirrel.'
