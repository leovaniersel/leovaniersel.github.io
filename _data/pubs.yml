  summary: Introduces fast heuristic methods, including some guided by a trained
    machine-learning model, for combining many evolutionary trees into a single explanatory
    network — a problem existing exact methods could only handle for a handful of
    trees — and shows the results are reliably close to the best possible solution
    on both simulated and real data.
  bibtex: |
    @article{bernardini2023constructing,
      author = {Bernardini, Giulia and van Iersel, Leo and Julien, Esther and Stougie, Leen},
