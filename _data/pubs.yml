  summary: Presents Cass, freely available software (integrated into the popular
    Dendroscope program) that combines conflicting groupings of species from different
    gene trees into a single evolutionary network, and shows that it reliably produces
    simpler networks, using fewer hybridization events, than previously available
    methods.
  bibtex: |
    @article{iersel2010phylogenetic,
      author = {van Iersel, Leo and Kelk, Steven and Rupp, Regula and Huson, Daniel},
      title = {{Phylogenetic Networks Do not Need to Be Complex: Using Fewer Reticulations to Represent Conflicting Clusters}},
      journal = {Bioinformatics},
      year = {2010},
      volume = {26},
      pages = {i124--i131}
    }
  abstract: 'Phylogenetic trees are widely used to display estimates of how groups
    of species are evolved. Each phylogenetic tree can be seen as a collection of
    clusters, subgroups of the species that evolved from a common ancestor. When phylogenetic
    trees are obtained for several datasets (e.g. for different genes), then their
    clusters are often contradicting. Consequently, the set of all clusters of such
    a dataset cannot be combined into a single phylogenetic tree. Phylogenetic networks
    are a generalization of phylogenetic trees that can be used to display more complex
    evolutionary histories, including reticulate events, such as hybridizations, recombinations
    and horizontal gene transfers. Here, we present the new Cass algorithm that can
    combine any set of clusters into a phylogenetic network. We show that the networks
    constructed by Cass are usually simpler than networks constructed by other available
    methods. Moreover, we show that Cass is guaranteed to produce a network with at
    most two reticulations per biconnected component, whenever such a network exists.
    We have implemented Cass and integrated it into the freely available Dendroscope
    software. Contact: l.j.j.v.iersel@gmail.com Supplementary information: Supplementary
    data are available at Bioinformatics online.'
