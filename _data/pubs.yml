  summary: Investigates parameterized algorithms for average-tree phylogenetic diversity
    in rooted phylogenetic networks. The work analyzes scanwidth and visibility-type
    restrictions, separating polynomial-time cases from NP-hardness and giving exponential-in-scanwidth
    dynamic programming algorithms.
  bibtex: |
    @misc{iersel2026averagetree,
      author = {van Iersel, Leo and Jones, Mark and Schestag, Jannik and Scornavacca, Celine and Weller, Mathias},
      title = {{Average-Tree Phylogenetic Diversity Parameterized by Scanwidth and Invisibility}},
      year = {2026},
      archivePrefix = {arXiv},
      eprint = {2604.27745},
      doi = {10.48550/arXiv.2604.27745},
      url = {https://doi.org/10.48550/arXiv.2604.27745}
    }
  abstract: We investigate parameterized algorithms for computing the average-tree
    phylogenetic diversity (APD) in rooted phylogenetic networks, studying the problem
    under different structural parameters that capture the deviation of a network
    from a tree. Our primary parameter is the scanwidth, a measure of the tree-likeness
    of a given directed acyclic graph. We show that a subset of taxa with maximum
    APD can be found in polynomial time in phylogenetic networks of scanwidth at most
    2, but becomes NP-hard in networks of scanwidth 3. Further, we design an algorithm
    that computes the APD of a given set of taxa in O(2^sw n) time, where sw denotes
    the scanwidth and n the number of taxa in the input network. Finally, we give
    a linear-time algorithm for computing the APD of a given set of taxa if the network
    induced by these taxa is reticulation-visible. We generalize this algorithm to
    still run in polynomial time if each biconnected component of the induced network
    has only constantly many invisible reticulations.
