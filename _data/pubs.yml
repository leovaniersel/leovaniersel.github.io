  summary: Shows that determining whether an evolutionary network — considered without
    knowing the direction of time — could have arisen from a tree-like history augmented
    by horizontal gene transfer is computationally hard, and introduces a new mathematical
    description of such networks that may help future research make progress despite
    this hardness.
