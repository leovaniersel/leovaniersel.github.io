    @misc{kelk2026kernel,
      author = {Kelk, Steven and Meuwese, Ruben and van Iersel, Leo},
      title = {{A kernel for the maximum agreement forest problem on multiple binary phylogenetic trees}},
      year = {2026},
      archivePrefix = {arXiv},
      eprint = {2602.22281},
