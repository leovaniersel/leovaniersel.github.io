  summary: Studies when an evolutionary network drawn without any indication of the
    direction of time can be consistently assigned a direction, giving efficient
    algorithms for this task both when some of the necessary information is already
    known and, more generally, when it must be inferred from the network's shape
    alone, for networks that are not too tangled.
  bibtex: |
    @article{huber2024orienting,
      author = {Huber, Katharina T and van Iersel, Leo and Janssen, Remie and Jones, Mark and Moulton, Vincent and Murakami, Yukihiro and Semple, Charles},
      title = {{Orienting undirected phylogenetic networks}},
      journal = {Journal of Computer and System Sciences},
