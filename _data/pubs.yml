  summary: Investigates whether knowing how much evolutionary change occurred along
    each branch — information usually available for trees but so far ignored in
    this context — can help determine whether a given tree is consistent with a
    larger evolutionary network; shows this remains computationally hard in general,
    but gives efficient methods for practically important special cases.
  bibtex: |
    @article{gambette2016do,
      author = {Gambette, Philippe and van Iersel, Leo and Kelk, Steven and Pardi, Fabio and Scornavacca, Celine},
      title = {{Do branch lengths help to locate a tree in a phylogenetic network?}},
      journal = {Bulletin of Mathematical Biology},
      year = {2016},
      volume = {78},
      number = {9},
      pages = {1773--1795}
    }
  abstract: 'Phylogenetic networks are increasingly used in evolutionary biology to
    represent the history of species that have undergone reticulate events such as
    horizontal gene transfer, hybrid speciation and recombination. One of the most
    fundamental questions that arise in this context is whether the evolution of a
    gene with one copy in all species can be explained by a given network. In mathematical
    terms, this is often translated in the following way: is a given phylogenetic
    tree contained in a given phylogenetic network? Recently this tree containment
    problem has been widely investigated from a computational perspective, but most
    studies have only focused on the topology of the phylo- genies, ignoring a piece
    of information that, in the case of phylogenetic trees, is routinely inferred
    by evolutionary analyses: branch lengths. These measure the amount of change (e.g.,
    nucleotide substitutions) that has occurred along each branch of the phylogeny.
    Here, we study a number of versions of the tree containment problem that explicitly
    account for branch lengths. We show that, although length information has the
    potential to locate more precisely a tree within a network, the problem is computationally
    hard in its most general form. On a positive note, for a number of special cases
    of biological relevance, we provide algorithms that solve this problem efficiently.
    This includes the case of networks of limited complexity, for which it is possible
    to recover, among the trees contained by the network with the same topology as
    the input tree, the closest one in terms of branch lengths.'
