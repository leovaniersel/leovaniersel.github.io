  pages: 592--611
  note: SIAM Journal on Discrete Mathematics, 21(3):592-611 (2007). Preliminary version
    in AB 2007, LNCS 4545:292-306. arXiv.
  doi-identifier: 10.1137/060664252
  doi-url: https://doi.org/10.1137/060664252
