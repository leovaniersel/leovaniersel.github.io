  software-url:
  summary: Studies prefix reversals on binary and ternary strings. The paper analyzes
    combinatorial properties and algorithmic questions related to sorting or transforming
    strings by prefix reversals.
  bibtex: |
    @article{hurkens2007prefix,
      author = {Hurkens, Cor and van Iersel, Leo and Keijsper, Judith and Kelk, Steven and Stougie, Leen and Tromp, John},
      title = {{Prefix reversals on binary and ternary strings}},
      journal = {SIAM Journal on Discrete Mathematics},
      year = {2007},
      volume = {21},
      number = {3},
      pages = {592--611}
    }
  abstract: Given a permutation pi, the application of prefix reversal f^(i) to pi
    reverses the order of the first i elements of pi. The problem of Sorting By Prefix
    Reversals (also known as pancake flipping), made famous by Gates and Papadimitriou
    (Bounds for sorting by prefix reversal, Discrete Mathematics 27, pp. 47-57), asks
    for the minimum number of prefix reversals required to sort the elements of a
    given permutation. In this paper we study a variant of this problem where the
    prefix reversals act not on permutations but on strings over a fixed size alphabet.
    We determine the minimum number of prefix reversals required to sort binary and
    ternary strings, with polynomial-time algorithms for these sorting problems as
    a result; demonstrate that computing the minimum prefix reversal distance between
    two binary strings is NP-hard; give an exact expression for the prefix reversal
    diameter of binary strings, and give bounds on the prefix reversal diameter of
    ternary strings. We also consider a weaker form of sorting called grouping (of
    identical symbols) and give polynomial-time algorithms for optimally grouping
    binary and ternary strings. A number of intriguing open problems are also discussed.
- title: The Complexity of the Single Individual SNP Haplotyping Problem
  release-date:
  authors:
  - first: Rudi
    last: Cilibrasi
  - first: Leo
    tussenvoegsel: van
    last: Iersel
  - first: Steven
    last: Kelk
