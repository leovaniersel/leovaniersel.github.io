    others are not, replacing an informal working definition with one that can actually
    be checked.
  bibtex: |
    @article{holtgrefe2025charachterizing,
      author = {Holtgrefe, Niels and Huber, Katharina T and van Iersel, Leo and Jones, Mark and Moulton, Vincent},
      title = {Characterizing semi-directed phylogenetic networks and their multi-rootable variants},
      journal={Theory in Biosciences},
      doi={10.1007/s12064-025-00453-8},
      volume = {145},
      pages = {4},
      number = {1},
      year = {2026}
    }
  abstract: In evolutionary biology, phylogenetic networks are graphs that provide
    a flexible framework for representing complex evolutionary histories that involve
    reticulate evolutionary events. Recently phylogenetic studies have started to
    focus on a special class of such networks called semi-directed networks. These
    graphs are defined as mixed graphs that can be obtained by de-orienting some of
    the arcs in some rooted phylogenetic network, that is, a directed acyclic graph
    whose leaves correspond to a collection of species and that has a single source
    or root vertex. However, this definition of semi-directed networks is implicit
    in nature since it is not clear when a mixed-graph enjoys this property or not.
    In this paper, we introduce novel, explicit mathematical characterizations of
    semi-directed networks, and also multi-semi-directed networks, that is, mixed
    graphs that can be obtained from directed phylogenetic networks that may have
    more than one root. In addition, through extending foundational tools from the
    theory of rooted networks into the semi-directed setting - such as cherry picking
    sequences, omnians, and path partitions - we characterize when a (multi-)semi-directed
    network can be obtained by de-orienting some rooted network that is contained
    in one of the well-known classes of tree-child, orchard, tree-based or forest-based
    networks. These results address structural aspects of (multi-)semi-directed networks
    and pave the way to improved theoretical and computational analyses of such networks,
    for example, within the development of algebraic evolutionary models that are
    based on such networks.
