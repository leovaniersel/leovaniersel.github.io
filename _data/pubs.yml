  summary: Shows that a class of evolutionary networks introduced purely for its
    computational advantages actually corresponds to a natural and biologically meaningful
    picture — an ordinary tree with extra sideways connections representing horizontal
    gene transfer — and proves that one can always move between any two such networks
    via a bounded number of small rearrangement steps.
  bibtex: |
