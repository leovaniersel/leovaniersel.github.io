    }
  abstract: Phylogenetic networks can represent evolutionary events that cannot be
    described by phylogenetic trees. These networks are able to incorporate reticulate
    evolutionary events such as hybridization, introgression, and lateral gene transfer.
    Recently, network-based Markov models of DNA sequence evolution have been introduced
    along with model-based methods for reconstructing phylogenetic networks. For these
    methods to be consistent, the network parameter needs to be identifiable from
    data generated under the model. Here, we show that the semi-directed network parameter
    of a triangle-free, level-1 network model with any fixed number of reticulation
    vertices is generically identifiable under the Jukes-Cantor, Kimura 2-parameter,
    or Kimura 3-parameter constraints.
