  summary: Shows that the problem of finding the simplest evolutionary network explaining
    several conflicting, not-necessarily-fully-resolved evolutionary trees can always
    be shrunk down to a much smaller instance before being solved exactly, and demonstrates
    using simulated data that this simplification step meaningfully speeds up solving
    the problem in practice.
